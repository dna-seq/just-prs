summary: >-
  All 14 chronotype scores sit in sleep.chronotype (axis: more of a morning person). The UK Biobank question
  (field 1180) is coded 1 = definitely morning to 4 = definitely evening, so the five scores trained on the raw
  value (Privé, Ding, GBE) or on sign-reversed morningness weights (Maukonen) point toward eveningness (sign -1).
  The eight Weissbrod scores use a binary morning-person trait and point toward morningness. The GBE
  ease-of-getting-up score points toward easier waking. After alignment, none of the 91 pairs conflict. The GBE
  coding and the Weissbrod case coding are inferred from lead variants and case fractions, not stated outright.
