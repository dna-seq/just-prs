summary: '35 stroke scores sit in one new concept, cardiovascular.stroke (higher = higher stroke risk), split into
  any stroke (22), ischaemic stroke (9), intracerebral haemorrhage (2) and cerebrovascular disease (1). LV stroke
  volume (PGS001413) is a heart measurement and out of scope. PGS005156 (PRS-CSx EAS+EUR, PGP000704) anti-correlates
  with every other stroke score and its canonical risk alleles (rs12445022 A, COL4A1/2 rs9521686 C) carry weights
  against risk: recorded as an inverted deposit (higher file score = lower risk), the same pattern as that paper''s
  asthma deposits. PGS004836 (PRSmix+) goes to review because its direction rests on the training design only. The
  remaining weak negative pairs are the ICH score PGS003457 against any-stroke scores (r about -0.2), which is plausible
  biology rather than a sign error.'
