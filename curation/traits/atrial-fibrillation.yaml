summary: 'All 62 atrial fibrillation scores point the same way: a higher score means a higher risk of
  atrial fibrillation (or flutter). 60 were annotated from the catalog, corroborated by HR/OR above 1
  or 1000G correlation with the anchor PGS000035; no score correlates negatively with another. Two scores
  from PGP000591 were read: they are PRSs of model-predicted 5-year AF risk (ECG-AI and the CHARGE-AF
  clinical score), and a higher value predicts more incident AF (HR 1.07 and 1.12 per SD). The CHARGE-AF
  score mostly captures clinical risk factors such as body size and correlates only weakly with the AF-diagnosis
  scores.'
