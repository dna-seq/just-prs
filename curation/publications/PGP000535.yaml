pgp_id: PGP000535
scores:
  PGS004238:
    cluster: cardiovascular.cardiovascular_disease
    phenotype: cardiovascular_disease
    measurement_kind: binary
    score_effect:
      direction: increases
      target: risk of cardiovascular disease in people with type 2 diabetes
      coding: null
    polarity: 1
    evaluation_outcome: null
    strata:
      population: type 2 diabetes patients (Han Chinese)
    provenance:
    - source: abstract
      locator: Abstract > Conclusions
      quote: T2DM patients with higher levels of weighted genetic risk score have higher cardiovascular disease
        risks.
      confidence: high
    - source: abstract
      locator: Abstract > Results
      quote: A GRS was generated by combining risk alleles from these variants weighted by their estimated effect
        sizes (log odds ratio [OR]).
      confidence: high
    - source: abstract
      locator: Abstract > Methods
      quote: The discovery cohort included 326 cardiovascular disease patients and 1209 noncardiovascular disease
        patients.
      confidence: high
    lead_variant_check:
      status: not_run
      note: Rare Han Chinese variants (rs139531447 etc.) not in GWAS Catalog lookups; no SNP table in open sources.
    review_reason: null
    corrections: []
    status: agent_proposed
    notes: wGRS of 35 variants found by GWAS/bootstrapping in Han Chinese T2D patients (CVD vs non-CVD). Event definition
      of CVD not in the abstract (no open full text). Near-zero 1000G EUR correlation with other CVD/CAD scores
      is expected for an EAS rare-variant score from a small discovery cohort.
paper:
  pmid: '33350037'
  doi: 10.1002/jgm.3305
  title: Genetic risk score constructed from common genetic variants is associated with cardiovascular disease risk
    in type 2 diabetes mellitus.
