  wellbeing:
    label: Well-being
    concepts:
      self_rated_health:
        label: Self-rated health and satisfaction with own health
        axis: better self-rated health
        valence: desirable
        valence_basis: Rating one's own health as good and being happy with it is the outcome people want.
        status: agent_proposed
        aliases:
        - self-rated health
        - how healthy do I feel
        - poor health rating
        - unhappy with my health
        - health satisfaction
        phenotypes:
          poorer_overall_health:
            label: Poorer self-rated overall health (UKB 2178, 1 excellent ... 4 poor)
            sign: -1
            aliases:
            - poor self-rated health
            - overall health rating
          unhappiness_with_health:
            label: Less happy with own health (UKB 4548 / 20459, 1 extremely happy ... 6 extremely unhappy)
            sign: -1
            aliases:
            - health dissatisfaction
            - happiness with own health
      fatigue:
        label: Tiredness and lethargy
        axis: more frequent tiredness
        valence: undesirable
        valence_basis: Frequent tiredness or lethargy lowers quality of life and is a common depressive
          symptom.
        status: agent_proposed
        aliases:
        - tiredness
        - fatigue
        - lethargy
        - low energy
        - always tired
        phenotypes:
          tiredness_frequency:
            label: Frequency of tiredness / lethargy in the last 2 weeks (UKB 2080, 1 not at all ... 4
              nearly every day)
            sign: 1
      social_connection:
        label: Social connection, loneliness and social activities
        axis: more social connection
        valence: desirable
        valence_basis: Feeling connected, satisfied with friendships and taking part in group activities
          is what people want; loneliness harms health.
        status: agent_proposed
        aliases:
        - loneliness
        - social isolation
        - lonely
        - friendships
        - social life
        phenotypes:
          loneliness:
            label: Often feels lonely (UKB 2020, yes vs no)
            sign: -1
            aliases:
            - feeling lonely
            - isolation
          friendship_dissatisfaction:
            label: Less satisfied with friendships (UKB 4570, 1 extremely happy ... 6 extremely unhappy)
            sign: -1
          weekly_social_activity:
            label: Attends a sports club, gym, pub, social club, religious group, adult education class
              or other group activity weekly or more (UKB 6160)
            sign: 1
          gym_or_sports_club_attendance:
            label: Regular attendance at a gym or sports club (UKB 6160)
            sign: 1
          adult_education_attendance:
            label: Regular attendance at an adult education class (UKB 6160)
            sign: 1
