summary: All 36 lung-cancer scores sit in one concept, cancer.lung_cancer (higher = higher risk), with
  subtype phenotypes (adenocarcinoma, squamous) and a family-history proxy. 30 were annotated from the
  catalog (OR/HR > 1 or 1000G correlation with OR-corroborated scores); 6 were read (PGP000518, 000596,
  000607, 000780). Two deposited files, PGS004691 (Hu 2024) and PGS005397 (Boumtje 2026), point against
  the known risk alleles at 15q25 CHRNA5, 19q13 and (PGS005397) 5p15 CLPTM1L and anti-correlate with the
  consensus; they are recorded as distributed (higher = lower risk) with deposit_inverted corrections
  and stay in review. Never-smoker (East Asian women) and smoker strata are recorded where quoted.
