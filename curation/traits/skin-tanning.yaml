summary: 'Tanning scores are UK Biobank field 1727 (1 very tanned .. 4 never tan, only burn), either one-hot
  per answer (Tanigawa) or as a scale. The -0.96 correlation is "very tanned" vs "mildly tanned": opposite
  answers, not a sign error. Prive "less_tanned" scores use the raw scale, so higher = tans less (polarity
  -1); Weissbrod "Tanning" scores point the other way (higher = tans more), inferred from lead variants
  and correlations because the coding is not documented. Childhood sunburn sits under skin tanning as
  burn-proneness (r=+0.86 with "never tan"). Sun protection (field 2267) and time outdoors are on the
  sun-exposure axis; genetically, burn-prone people report more protection. After alignment no same-concept
  pair correlates negatively.'
