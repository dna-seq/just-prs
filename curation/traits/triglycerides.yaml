summary: 'All 75 triglyceride scores map to one new concept, lipids.triglycerides (higher triglycerides,
  undesirable). 70 are catalog-only "higher score = higher TG", corroborated by positive catalog betas/ORs
  against TG or 1000G EUR correlation with an annotated TG score, and checked against 8 reference TG lead
  SNPs. PGS000063 (MESA, PGP000045) is an inverted deposit like PGS000061: as scored from the catalog
  file, higher = lower TG; it goes to review. Three weighted-LDpred2 files in PGP000489 (PGS003805/3810/3815)
  have broken near-constant weights, and PGS003482 is uncorrelated with every other TG score; all four
  are left unannotated. Four ExPRSweb LASSOSUM/PRS-CS builds (PGS003144/3148/3149/3153) carry inverted
  weights at large-effect TG loci despite positive overall correlation, and are flagged for review.'
