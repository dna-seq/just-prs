summary: 'All 32 thyroid cancer scores (14 papers) point the same way: a higher score means higher thyroid
  cancer risk. 27 were annotated from the catalog alone (plain ''Thyroid cancer'' trait, ORs/HRs above
  1 with CIs excluding 1, or positive 1000G correlation with the CC_Thyroid anchor); the one 2025 multi-ancestry
  paper (PGP000748) was read. Two of its scores rank thyroid nodules as malignant vs benign goiter and
  sit in their own phenotype. No negative correlations, no suspected inverted deposits. PGS001794/PGS001799
  carry a canary collapsed-percentile flag, so their percentiles should not be shown.'
