summary: >-
  eGFR, serum creatinine and cystatin C sit in kidney.kidney_function (eGFR +1, creatinine and cystatin C -1); CKD and
  kidney failure in kidney.chronic_kidney_disease. 120 of 151 in-scope scores annotated (mostly catalog-only or the
  ExPRSweb template), no aligned-correlation conflicts. ExPRSweb (PGP000393) is a method grid, not sign flips, except
  the 20 scores built from the CKDGen 1000 Genomes eGFRcrea/eGFRcys files, which run the creatinine way and are left
  unannotated. "Creatine" in the catalog means creatinine (UKB 30700 serum; 30510 is urine creatinine, out of scope).
  PGS002757, PGS000883-885, PGS003377 await lookups; PGS005090 and PGS005318 unread.
