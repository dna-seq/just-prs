summary: '104 CAD/CHD/MI scores from 55 papers, all in one concept (cardiovascular.coronary_artery_disease) with
  two phenotypes: coronary artery disease (83) and myocardial infarction (21). 102 follow the catalog convention
  (higher score = higher risk), annotated catalog-only on positive HR/OR CIs or 1000G r >= +0.2 with the metaGRS
  anchor. Two deposits look allele-inverted: PGS004237 (Manikpurage 2021) and PGS000116 (Elliott 2020). Both papers
  say higher PRS = more CAD, but the files give the protective allele a positive weight at 9p21/PHACTR1/LPA and
  correlate -0.6 to -0.95 with every other CAD score; they are recorded as distributed (higher score = lower risk)
  and sent to review. After alignment no same-concept pair correlates below -0.2.'
