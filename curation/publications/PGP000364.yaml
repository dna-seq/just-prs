      confidence: medium
    lead_variant_check:
      status: agree
      note: '6 agree, 2 small opposite weights at SNPs in LD with a correctly signed neighbour (joint-model shrinkage):
        rs629301 T +9.08e-05; rs11591147 T -0.142; rs6511720 T -0.00164; rs7412 T +0.0421; rs4420638 G +0.0273;
        rs1367117 A -0.000333; rs4299376 T -0.0204; rs12916 C +0.0127'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by its own catalog metric, OR 1.72 [1.67, 1.77] for Hypercholesterolemia, CI excluding
      the null. Score named LDL_prscs but deposited for hypercholesterolemia (FinnGen).
