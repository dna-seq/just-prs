summary: 'All 25 in-scope scores sit in blood.platelet_count (new Blood cells domain). 24 predict platelet count itself
  (higher score = more platelets), including three pregnancy-trimester scores stratified by trimester; one predicts gestational
  thrombocytopenia (higher score = more risk = fewer platelets, phenotype sign -1). Two anchors were read from cached
  full text, the Chinese pregnancy paper was read by one lookup, and the rest are catalog-only with 1000G EUR r >= +0.58
  and the SH2B3 rs3184504-T platelet-raising allele weighted positively. Two scores go to review: the Biobank Japan BOLT-LMM
  score (weak EUR corroboration) and the GT score (direction inferred from weights matching the published PEAR1 log-OR).
  Variance and INFLA scores are out of scope.'
