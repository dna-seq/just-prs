  PGS004585:
    cluster: blood.platelet_count
    phenotype: gestational_thrombocytopenia
    measurement_kind: binary
    score_effect:
      direction: increases
      target: risk of gestational thrombocytopenia (any platelet count < 150 x 10^9/L in trimester 2 or 3)
      coding: null
    polarity: -1
    evaluation_outcome: null
    strata:
      sex: female
    provenance:
    - source: full_text
      locator: Methods > PRS
      quote: to construct PRSs for platelet counts of the 5 periods during pregnancy and GT.
      confidence: medium
    - source: full_text
      locator: Methods > Phenotype definition
      quote: GT was defined as having at least 1 platelet count
      confidence: high
    - source: full_text
      locator: Results > GWAS of GT
      quote: The rs12048392-C allele and rs12566888-G allele were associated with an increased risk of GT and severe
        GT.
      confidence: medium
    lead_variant_check:
      status: agree
      note: PEAR1 rs12048392-T weight -0.550, i.e. the GT risk allele C carries +0.55 = ln(OR 1.72) from the paper;
        ARHGEF3 rs1354034-T (platelet-lowering) weight +0.228
    review_reason: Paper never states what a higher GT PRS means; direction inferred from weights matching the published
      GT log-OR at PEAR1.
    status: agent_proposed
    notes: 'PRSice-2 on the authors'' GT GWAS (11 138 cases, 85 294 controls, Chinese NIPT). Weights behave as log-OR
      for GT: higher score = more GT risk = lower platelets (phenotype sign -1). 1000G EUR r=-0.30 with the T1 platelet
      score, consistent after alignment.'
