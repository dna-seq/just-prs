summary: 72 of 74 scores are in scope under cardiovascular.blood_pressure (hypertension, one SBP-weighted score); all 72 are
  annotated as higher score = more hypertension. 42 form one strongly positively correlated block in 1000G EUR; 50 are resolved
  (catalog-only except PGS004236, read in full text). The ExPRSweb (PGP000393) scores built on FinnGen R4 GWAS (20) plus two
  DBSLMM scores are null in the paper's own evaluation and uncorrelated with the block, so they go to review; the UKB 20002-1072
  and I10 ExPRSweb groups are weak but significant and also sit apart from the block. No negative correlations or suspected
  inverted deposits. Age at diagnosis (PGS000935) and gestational hypertension (PGS003587) are out of scope.
