pgp_id: PGP000244
paper:
  pmid: '35324888'
  doi: 10.1371/journal.pgen.1010105
  title: Significant sparse polygenic risk scores across 813 traits in UK Biobank.
evidence_read:
  abstract: true
  full_text: europepmc
  supplement: []
template:
  rule: 'Each score is a snpnet regression predicting the phenotype itself: binomial model on case status for binary
    traits (higher score = more likely case), Gaussian model on the median raw value for quantitative traits (higher
    score = higher value). Reverse-coded questionnaire fields need their own coding.'
  provenance:
  - source: full_text
    locator: Methods > Phenotype definitions
    quote: Briefly, for binary traits, we performed manual curation of phenotypic definitions and assigned “case”
      status if the participants are classified as the case in at least one of their visits and “control” otherwise.
      For quantitative traits, we took the median of non-NA values, as described elsewhere [ 55 ].
    confidence: medium
  - source: full_text
    locator: Methods (model families)
    quote: We used the Gaussian family and the R 2 metric for quantitative traits, whereas we used the binomial
      family and the AUC-ROC metric for the binary traits [ 10 ].
    confidence: medium
