      status: agree
      note: T2D risk alleles rs7903146 T (TCF7L2), rs3802177 G (SLC30A8), rs4402960 T (IGF2BP2) carry positive weights;
        weights from the Scott 2017 T2D GWAS (GCST004773).
    review_reason: null
    status: agent_proposed
    notes: 'Catalog label "Insulin secretion" reads the opposite way: this is a sum of 14 T2D risk alleles (Scott
      2017 insulin-secretion cluster) weighted by T2D log(OR), so a higher score means more T2D risk and lower genetic
      insulin secretion (CFRD HR 1.247). Explains its negative 1000G correlation with PGS000835 (r=-0.27) and PGS002277
      (r=-0.37).'
