summary: 'All 40 HbA1c scores sit in the new concept endocrine.glycemia (axis: higher blood sugar), phenotype hba1c (+1); a higher percentile means higher
  HbA1c. 34 were annotated from the catalog, corroborated by PGP000517 betas against HbA1c (CI excludes 0) and positive 1000G EUR correlations (no same-concept
  pair below -0.2). The six Wheeler 2017 scores (PGP000064) were read: all weight HbA1c-raising alleles; the three erythrocytic (GS-E) scores raise HbA1c
  through red-cell biology, not glucose, and do not raise T2D risk. PGS002367 (Biobank Japan-trained) correlates only weakly (r~+0.1) with European scores
  and is flagged for review. PGS000712 is a T2D score and out of scope.'
