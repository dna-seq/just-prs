paper:
  pmid: '36152628'
  doi: 10.1016/j.ajhg.2022.09.001
  title: 'ExPRSweb: An online repository with polygenic risk scores for common health-related exposures.'
evidence_read:
  abstract: false
  full_text: null
  supplement: []
template:
  rule: 'ExPRSweb method grid: each exposure GWAS (named in the score name: UKB fields 30510 urine creatinine, 30700
    serum creatinine, 30720 cystatin C; CKDGen eGFRcrea/eGFRcys files) x 5 methods (C+T GT/DS, lassosum, DBSLMM,
    PRS-CS) x 2 cohorts (MGI, UKB). Weights are the GWAS effect sizes of the exposure, so higher score = higher
    GWAS trait, unless the input file''s allele coding was reversed (the CKDGen-1000Genomes-DiscoveryMeta files
    behave reversed in 1000G and in the paper''s own evaluation; left unannotated). The catalog label "Creatine"
    means creatinine (Table 1 "Creatinine renal biomarker").'
  provenance:
  - source: full_text
    locator: Methods > PRS construction
    quote: is the log odds ratios retrieved from the external GWAS summary statistics for variant
    confidence: medium
