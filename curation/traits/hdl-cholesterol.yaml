summary: 'All 90 in-scope HDL cholesterol scores sit in one concept, lipids.hdl_cholesterol (axis higher HDL-C,
  desirable). 85 read catalog-only as higher score = higher HDL-C, bootstrapped from the PGP000517 betas (CI excludes
  the null) and 1000G correlation >= +0.32. Two deposits are inverted and recorded as distributed (higher = lower
  HDL-C) with corrections: PGS000060 (MESA, same A2_weight defect as its LDL/TG/TC siblings) and PGS000825 (paper
  says Q4 = higher HDL-C, file and supplement point the other way at GALNT2/ABCA1/HNF4A, r = -0.81 with consensus).
  Three weighted-LDpred2 files from PGP000489 (PGS003771, PGS003776, PGS003781) have near-constant weights and are
  proposed for quarantine. After alignment there are no negative correlations left inside the concept.'
