    notes: 'SBayesR weights from the authors'' own 25OHD GWAS (417,580 UKB Europeans). The paper reports PRS prediction
      only as variance explained and never states the sign in words; direction follows the PGS Catalog convention
      and is corroborated by the developers'' catalog betas on 25OHD (PPM002526 beta 0.269, se 0.02; PPM002527 beta
      0.24, se 0.024; CI excludes 0), 1000G EUR r = +0.81 with PGS000702, and a positive correlation with 25OHD
      in Lebanese (PGP000600 Fig. 4: R = 0.2033). The catalog best-performance OR 0.82 [0.78, 0.86] (PPM021729,
      PGP000665 Table 1; UKB OR 0.60) is per SD for a vitamin D level dichotomized at 30 nmol/L; the paper prints
      "Vitamin D > 30 nmol/L", but OR < 1 only fits cases = low vitamin D, so the ">" looks like a typo and the
      metric is read as against deficiency. A third-party OR 1.6 [1.3, 13.7] for deficiency (PPM020900, PGP000600,
      194 people, 41,736 of 1,094,650 variants) has no stated comparison and an implausible CI; ignored.'
