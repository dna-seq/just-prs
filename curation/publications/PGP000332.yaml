    cluster: sleep.chronotype
    phenotype: morningness
    measurement_kind: binary
    score_effect:
      direction: increases
      target: likelihood of being a morning person (UKB binary trait other_MORNINGPERSON, case fraction 0.625)
      coding: binary collapse of UKB 1180; morning person = case (inferred from the trait label and 62.5% case fraction
        in Loh 2018)
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: supplement
      locator: Weissbrod 2022 Supplementary Table 3 (weissbrod_MOESM4.S3.csv)
      quote: Chronotype (morning person),301397,0.1091,0.0055,No,No
      confidence: medium
    - source: supplement
      locator: Loh et al. 2018 Supplementary Table 1 (Phenotype, N, Fraction phenotyped, Case fraction) (loh2018_MOESM1.txt)
      quote: Chronotype (morning person) 410520 0.89 0.625
      confidence: medium
    lead_variant_check:
      status: agree
      note: rs1144566-T weight +0.0005 (T = morning allele, Jones 2019 OR 1.24)
    review_reason: Weissbrod MORNINGPERSON coding inferred from label and case fraction
    status: agent_proposed
    notes: BOLT-LMM weights on UKB British GWAS of the binary morning-person trait. Higher = more likely a morning
      person. Negative 1000G correlations with the evening-coded field-1180 scores (Privé, Ding, GBE, Maukonen)
      are the expected opposite coding, not a sign flip; no sentence states the case coding outright.
