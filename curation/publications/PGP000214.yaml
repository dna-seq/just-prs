    - source: full_text
      locator: Methods > Polygenic risk scores
      quote: subsets of T2D-associated variants that were classified as acting on insulin secretion versus insulin
        action
      confidence: high
    - source: full_text
      locator: Methods > Polygenic risk scores
      quote: The PRSs were calculated as a log(OR) or effect size-weighted sum of risk alleles
      confidence: high
