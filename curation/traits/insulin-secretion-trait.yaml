slug: insulin-secretion-trait
query: insulin secretion trait
match:
  terms:
  - beta-cell function
  - disposition index
  - insulin response
  - insulin secretion
  efo_ids:
  - OBA_VT0003564
  exclude: []
anchor: PGS002277
status: resolved
concepts:
- endocrine.type_2_diabetes
scores:
  PGS000834:
    decision: in_scope
    note: 'corrected insulin response (OGTT 30 min); beta-cell function measure'
  PGS000835:
    decision: in_scope
    note: 'insulin secretion rate; beta-cell function measure'
  PGS000852:
    decision: in_scope
    note: 'T2D risk score from insulin-secretion loci (already annotated)'
  PGS000853:
    decision: in_scope
    note: 'T2D risk score from insulin-secretion loci (already annotated)'
  PGS000871:
    decision: in_scope
    note: 'labelled insulin secretion but weighted by T2D log(OR) of risk alleles; higher = lower secretion'
  PGS002277:
    decision: in_scope
    note: 'HOMA-B weighted beta-cell function score (already annotated)'
summary: |
  Insulin secretion scores sit in the type 2 diabetes concept under the genetic_beta_cell_function phenotype (sign -1).
  PGS000835 (insulin secretion rate) and PGS000834 (corrected insulin response) are higher = more insulin secretion,
  lower diabetes risk (catalog-only, catalog ORs < 1 and r about +0.3 with PGS002277).
  PGS000871 is labelled "Insulin secretion" but sums T2D risk alleles from insulin-secretion loci weighted by T2D log(OR):
  higher = lower secretion, more T2D/CFRD risk. Its r = -0.27 with PGS000835 is a construct difference, not a sign flip.
