  PGS005141:
    cluster: respiratory.asthma
    phenotype: asthma
    measurement_kind: binary
    score_effect:
      direction: decreases
      target: risk of asthma, as the deposited scoring file behaves (suspected inverted effect alleles)
      coding: null
    polarity: -1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: full_text
      locator: Methods > Disease selections
      quote: 'For asthma, cataract, cholelithiasis, colon polyp, and stroke, cases were chosen if they met any of
        these criteria: a diagnosis of each respective disease, taking medication for the same, or undergoing treatment
        for it.'
      confidence: low
    - source: full_text
      locator: Methods > Statistical analysis
      quote: The perSD OR was derived using this logistic regression.
      confidence: low
    lead_variant_check:
      status: agree
      note: 'Relative to the recorded ''decreases'': deposited weights rs17293632-T -0.0012, rs1837253-C -0.0199,
        rs10455025-C -0.0093; GWAS Catalog reports T, C, C as the asthma-raising alleles, so all three leads carry
        negative weights on risk alleles'
    review_reason: 'Suspected inverted deposit: paper reports a positive perSD OR (1.27 for PRS-CS, Table 2) but
      the deposited file''s lead risk alleles carry negative weights and the score correlates -0.8 to -0.9 in 1000G
      with other EAS-derived asthma scores; direction recorded as the file behaves.'
    corrections:
    - kind: deposit_inverted
      action: polarity_as_distributed
      effect: Direction/polarity describe the file as distributed (decreases risk of asthma, as the deposited scoring
        file behaves (suspected inverted effect alleles)); the paper says higher = increases. Weights are not modified.
      paper_direction: increases
      evidence: 'Relative to the recorded ''decreases'': deposited weights rs17293632-T -0.0012, rs1837253-C -0.0199,
        rs10455025-C -0.0093; GWAS Catalog reports T, C, C as the asthma-raising alleles, so all three leads carry
        negative weights on risk alleles | Suspected inverted deposit: paper reports a positive perSD OR (1.27 for
        PRS-CS, Table 2) but the deposited file''s lead risk alleles carry negative weights and the score correlates
        -0.8 to -0.9 in 1000G with other EAS-derived asthma scores; direction recorded as the file behaves. | Scoring
        file has only rsID/effect_allele/effect_weight (no other_allele), so …'
      recorded: '2026-09-27'
      by: agent
      upstream_report: null
    - kind: metric_not_from_file
      action: discount_metrics
      effect: The paper's performance metrics (OR/HR/AUROC) describe the authors' own score, not this inverted file,
        so they must not raise its quality tier.
      paper_direction: null
      evidence: Metrics were reported in the paper for the non-inverted score; the deposited file behaves as its
        negation.
      recorded: '2026-09-27'
      by: agent
      upstream_report: null
    status: agent_proposed
    notes: Scoring file has only rsID/effect_allele/effect_weight (no other_allele), so the effect allele was probably
      mislabelled at deposit. As computed from the PGS Catalog file, a higher score means LOWER asthma risk; the
      authors' own score (per the paper) raised risk. Catalog BETA 1.27/1.31 are the paper's perSD ORs, not a property
      of the deposited file.
