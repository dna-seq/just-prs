paper:
  pmid: '33067605'
  doi: 10.1038/s42255-020-00287-2
  title: Genomic and drug target evaluation of 90 cardiovascular proteins in 30,931 individuals.
evidence_read:
  abstract: true
  full_text: pmc_html
  supplement: []
template:
  rule: Each score is an LDpred polygenic score built from SCALLOP GWAS summary statistics of one Olink CVD-I protein
    (NPX, rank-inverse normalised); a higher score means a higher predicted circulating level of that protein.
  provenance:
  - source: full_text
    locator: Methods > Polygenic risk score calculation
    quote: Polygenic risk scores were derived using LDpred algorithm 45 , which adjusts the effect of each SNP allele
      for those of other SNP alleles in linkage disequilibrium (LD) with it
    confidence: medium
  - source: full_text
    locator: Methods > GWAS cohort analyses
    quote: NPX values of proteins (on the log 2 scale) were rank-based inverse normal transformed and/or standardised
      to unit variance
    confidence: medium
  - source: full_text
    locator: Results > Mendelian randomization using polygenic risk scores
    quote: an increase in the PRS equivalent to a 1 standard deviation higher circulating ST2, corresponded to a
      8.6 % (95%CI 3.8%, 13.2%; P=0.004) reduction in the relative risk of asthma
    confidence: high
exploration_findings: 79 per-protein scores in one paper; no directional metric in the catalog (variance explained
  only). Each protein is its own concept, so the many negative 1000G correlations between different proteins' scores
  are not sign flips.
