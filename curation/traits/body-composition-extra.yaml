summary: Six whole-body water mass scores and seven impedance-predicted segment mass scores (arms, legs, trunk)
  all go under anthropometry.lean_mass at polarity +1 (new phenotype body_water_mass; predicted_muscle_mass widened
  to arms). Each correlates +0.6 to +1.0 with an annotated fat-free mass score, and water mass is r = +1.00 with
  fat-free mass from the same paper. The negative pairs (min r = -0.61) are all against the impedance score PGS003540,
  which runs opposite to lean mass by design; PGS003902 is not an inverted deposit (FTO and MC4R lead alleles point
  to more mass). Nine ankle spacing width scores are a heel-ultrasound set-up measure and are out of scope.
