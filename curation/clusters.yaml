version: 0
domains:
  aging:
    label: Aging
    concepts:
      lifespan:
        label: Lifespan and survival
        axis: longer life
        valence: desirable
        valence_basis: Longer survival is the outcome people want.
        status: agent_proposed
        aliases:
        - longevity
        - life expectancy
        - life span
        - mortality
        - age at death
        phenotypes:
          longevity:
            label: Survival to old age / longer lifespan
            sign: 1
          all_cause_mortality:
            label: Death from any cause
            sign: -1
          parental_age_at_death:
            label: Parent's age at death (proxy for own lifespan)
            sign: 1
  endocrine:
    label: Endocrine and metabolic
    concepts:
      type_1_diabetes:
        label: Type 1 diabetes
        axis: higher risk of type 1 diabetes
        valence: undesirable
        valence_basis: Type 1 diabetes is a lifelong autoimmune disease requiring insulin.
        status: agent_proposed
        aliases:
        - T1D
        - juvenile diabetes
        - insulin-dependent diabetes
        phenotypes:
          type_1_diabetes:
            label: Type 1 (insulin-dependent) diabetes
            sign: 1
      type_2_diabetes:
        label: Type 2 diabetes
        axis: higher risk of type 2 diabetes
        valence: undesirable
        valence_basis: Type 2 diabetes is a chronic metabolic disease with vascular, kidney and eye complications.
        status: agent_proposed
        aliases:
        - adult-onset diabetes
        - high blood sugar
        - insulin resistance diabetes
        - diabetes risk
        phenotypes:
          type_2_diabetes:
            label: Type 2 (non-insulin-dependent) diabetes
            sign: 1
            aliases:
            - incident type 2 diabetes
            - early-onset type 2 diabetes
          genetic_beta_cell_function:
            label: Genetically determined beta cell function (insulin secretion)
            sign: -1
            aliases:
            - insulin secretion
            - beta cell function
      glycemia:
        label: Blood sugar (glycemia)
        axis: higher blood sugar
        valence: undesirable
        valence_basis: Higher glycemia is the direction of diabetes and its complications.
        status: agent_proposed
        aliases:
        - blood sugar
        - blood glucose
        - sugar levels
        - low blood sugar
        - long-term blood sugar
        phenotypes:
          hba1c:
            label: Glycated haemoglobin (HbA1c)
            sign: 1
            aliases:
            - A1c
            - average blood sugar over three months
            - glycated hemoglobin
          fasting_glucose:
            label: Fasting blood glucose
            sign: 1
            aliases:
            - fasting blood sugar
            - FPG
            - morning blood sugar
            - glucose level
          random_glucose:
            label: Non-fasting (random) blood glucose
            sign: 1
            aliases:
            - non-fasting glucose
            - random blood sugar
            - serum glucose
      gout:
        label: Gout
        axis: higher risk of gout
        valence: undesirable
        valence_basis: Gout is a painful inflammatory arthritis caused by urate crystal deposition.
        status: agent_proposed
        aliases:
        - gouty arthritis
        - hyperuricemia
        - high uric acid
        - urate crystals
        phenotypes:
          gout:
            label: Gout (diagnosis or incident gout)
            sign: 1
            aliases:
            - incident gout
            - gout attack
          serum_urate:
            label: Serum or plasma urate (uric acid) level
            sign: 1
            aliases:
            - uric acid
            - serum uric acid
            - blood urate
  cognition:
    label: Cognition
    concepts:
      cognitive_ability:
        label: Cognitive ability
        axis: higher cognitive test performance
        valence: neutral
        valence_basis: Test performance is a trait, not a health outcome; left uncolored to avoid ranking
          people.
        status: agent_proposed
        aliases:
        - intelligence
        - IQ
        - general cognitive ability
        - reasoning
        phenotypes:
          fluid_intelligence:
            label: Fluid intelligence (reasoning test score)
            sign: 1
          intelligence_quotient:
            label: Intelligence quotient (IQ)
            sign: 1
          executive_function:
            label: Common executive function
            sign: 1
  pigmentation:
    label: Pigmentation and appearance
    concepts:
      skin_tanning:
        label: Skin tanning ability
        axis: tans more easily
        valence: neutral
        valence_basis: Appearance trait; poor tanning raises skin-cancer risk, but that is a separate
          concept.
        status: agent_proposed
        aliases:
        - tanning
        - suntan
        - sunburn
        - burns easily
        - skin type
        phenotypes:
          tanning_ability:
            label: Overall ease of tanning (ordinal UKB 1727 treated as a scale)
            sign: 1
          tan_very:
            label: Gets very tanned (UKB 1727 answer 1)
            sign: 1
          tan_moderate:
            label: Gets moderately tanned (UKB 1727 answer 2)
            sign: 1
          tan_mild:
            label: Gets mildly or occasionally tanned (UKB 1727 answer 3)
            sign: -1
          never_tan_only_burn:
            label: Never tans, only burns (UKB 1727 answer 4)
            sign: -1
          childhood_sunburn:
            label: Childhood sunburn occasions before age 15 (UKB 1737)
            sign: -1
      hair_color:
        label: Hair color
        axis: darker hair
        valence: neutral
        valence_basis: Appearance trait with no health ranking.
        status: agent_proposed
        aliases:
        - hair colour
        - blonde
        - brunette
        - dark hair
        - light hair
        phenotypes:
          hair_darkness:
            label: Natural hair darkness (ordinal scale)
            sign: 1
          black_hair:
            label: Black natural hair (UKB 1747 = 5)
            sign: 1
          dark_brown_hair:
            label: Dark brown natural hair (UKB 1747 = 4)
            sign: 1
          brown_hair:
            label: Brown natural hair (GBE grouping of UKB 1747)
            sign: 1
          light_brown_hair:
            label: Light brown natural hair (UKB 1747 = 3)
            sign: -1
          blonde_hair:
            label: Blonde natural hair (UKB 1747 = 1)
            sign: -1
      red_hair:
        label: Red hair
        axis: red hair
        valence: neutral
        valence_basis: Appearance trait with no health ranking.
        status: agent_proposed
        aliases:
        - ginger hair
        - redhead
        - red hair colour
        phenotypes:
          red_hair:
            label: Red natural hair (UKB 1747 = 2)
            sign: 1
      male_pattern_baldness:
        label: Male pattern baldness
        axis: more balding
        valence: neutral
        valence_basis: Appearance trait with no health ranking; many men would rather keep their hair,
          but balding itself is not a disease.
        status: agent_proposed
        aliases:
        - hair loss
        - androgenetic alopecia
        - going bald
        - receding hairline
        - keeping my hair
        phenotypes:
          balding_pattern:
            label: Hair/balding pattern in men (UKB 2395 pattern 1-4 treated as a scale)
            sign: 1
          balding_pattern_1:
            label: Balding pattern 1 in men (UKB 2395 = 1)
            sign: -1
  lifestyle:
    label: Lifestyle and behavior
    concepts:
      sun_exposure:
        label: Sun exposure and protection
        axis: more sun exposure
        valence: context_dependent
        valence_basis: More UV exposure raises skin-cancer risk but also vitamin D; sun protection is
          the reverse side of the same axis.
        status: agent_proposed
        aliases:
        - sunscreen
        - sun protection
        - time outdoors
        - UV exposure
        phenotypes:
          sun_protection_use:
            label: Use of sun/UV protection (ordinal UKB 2267 treated as a scale, more protection)
            sign: -1
          sun_protection_never_rarely:
            label: Never or rarely uses sun protection (UKB 2267 answer 1)
            sign: 1
          sun_protection_sometimes:
            label: Sometimes uses sun protection (UKB 2267 answer 2)
            sign: 1
          sun_protection_always:
            label: Always uses sun protection (UKB 2267 answer 4)
            sign: -1
          time_outdoors_summer:
            label: Hours per day spent outdoors in summer (UKB 1050)
            sign: 1
          time_outdoors_winter:
            label: Hours per day spent outdoors in winter (UKB 1060)
            sign: 1
      coffee_consumption:
        label: Coffee consumption
        axis: more coffee drinking
        valence: neutral
        valence_basis: Habitual coffee intake is a dietary preference; moderate intake is not considered
          harmful for most adults and caffeine tolerance varies.
        status: agent_proposed
        aliases:
        - coffee intake
        - caffeine intake
        - cups of coffee per day
        - coffee drinker
        - non coffee drinker
        phenotypes:
          coffee_intake:
            label: Cups of coffee per day (UKB 1498, decaffeinated included)
            sign: 1
          coffee_drunk_yesterday:
            label: Drank any coffee yesterday (UKB 100240, 24-hour diet recall; yes = case)
            sign: 1
      coffee_type:
        label: Type of coffee usually drunk
        axis: prefers ground (brewed) coffee over instant coffee
        valence: neutral
        valence_basis: Coffee type is a taste and habit preference with no clear health ranking.
        status: agent_proposed
        aliases:
        - instant coffee
        - ground coffee
        - espresso or filter coffee
        - coffee preference
        phenotypes:
          ground_coffee:
            label: Usually drinks ground coffee incl. espresso and filter (UKB 1508 answer 3 vs other
              answers)
            sign: 1
          instant_coffee:
            label: Usually drinks instant coffee (UKB 1508 answer 2 vs other answers)
            sign: -1
  substance_use:
    label: Substance use
    concepts:
      smoking:
        label: Smoking
        axis: more smoking
        valence: undesirable
        valence_basis: Smoking is the leading preventable cause of disease and death.
        status: agent_proposed
        aliases:
        - tobacco
        - cigarettes
        - smoker
        - never smoker
        - quitting smoking
        phenotypes:
          ever_smoked:
            label: Ever smoked (ever vs never; includes smoking initiation = ever a regular smoker)
            sign: 1
          never_smoker:
            label: Never smoked (never smokers are the cases)
            sign: -1
          smoking_status:
            label: Smoking status (ever/never or never/previous/current; exact coding not stated)
            sign: 1
          previous_smoker:
            label: Former smoker vs everyone else (controls are mostly never smokers plus current smokers)
            sign: 1
          current_smoker:
            label: Current smoker (vs everyone else)
            sign: 1
          cigarettes_per_day:
            label: Cigarettes smoked per day
            sign: 1
          difficulty_abstaining:
            label: 'Difficulty going without smoking for a day (UKB 3476: 1 very easy to 4 very difficult)'
            sign: 1
          time_to_first_cigarette:
            label: Time from waking to first cigarette (longer time = lighter dependence)
            sign: -1
          age_stopped_smoking:
            label: Age stopped smoking (later quitting = longer smoking career)
            sign: 1
          age_at_smoking_initiation:
            label: Age at starting regular smoking (later start = less smoking)
            sign: -1
      alcohol_consumption:
        label: Alcohol consumption
        axis: more alcohol drinking
        valence: undesirable
        valence_basis: Alcohol harm rises with the amount consumed.
        status: agent_proposed
        aliases:
        - drinking
        - alcohol intake
        - drinks per week
        phenotypes:
          alcohol_quantity:
            label: Amount of alcohol drunk (drinks per week, grams, typical-day amount, AUDIT-C)
            sign: 1
          alcohol_intake_frequency:
            label: How often alcohol is drunk
            sign: 1
          current_drinker:
            label: Being a current drinker rather than a never or former drinker
            sign: 1
          drinking_more_than_before:
            label: Drinking more now than 10 years ago
            sign: 1
      alcohol_use_disorder:
        label: Alcohol use disorder
        axis: higher risk of problematic alcohol use
        valence: undesirable
        valence_basis: Alcohol dependence and problematic use are clinical disorders.
        status: agent_proposed
        aliases:
        - alcoholism
        - alcohol dependence
        - problem drinking
        - alcohol addiction
        phenotypes:
          alcohol_use_disorder:
            label: Alcohol use disorder or dependence (DSM diagnosis or criterion count, ICD-10 F10)
            sign: 1
          problematic_alcohol_use:
            label: Problematic alcohol use (AUDIT-P problems score, PAU meta-analysis phenotype)
            sign: 1
      nicotine_dependence:
        label: Nicotine dependence (tobacco use disorder)
        axis: more nicotine dependence
        valence: undesirable
        valence_basis: Tobacco use disorder is a diagnosed addiction that drives continued smoking and
          its harms.
        status: agent_proposed
        aliases:
        - nicotine addiction
        - tobacco use disorder
        phenotypes:
          tobacco_use_disorder:
            label: Tobacco use disorder / ICD-10 F17 / nicotine dependence diagnosis
            sign: 1
  sleep:
    label: Sleep
    concepts:
      chronotype:
        label: Chronotype (morning vs evening person)
        axis: more of a morning person
        valence: neutral
        valence_basis: A circadian preference, not a health outcome.
        status: agent_proposed
        aliases:
        - morning person
        - evening person
        - night owl
        - early bird
        - lark
        phenotypes:
          morningness:
            label: Morning person (morning chronotype)
            sign: 1
          eveningness:
            label: Evening person (evening chronotype)
            sign: -1
          ease_getting_up:
            label: Ease of getting up in the morning
            sign: 1
      sleep_duration:
        label: Sleep duration (hours of sleep)
        axis: longer habitual sleep
        valence: context_dependent
        valence_basis: U-shaped; both short (<7 h) and long (>9 h) sleep are associated with worse health,
          so neither end is simply good.
        status: agent_proposed
        aliases:
        - hours of sleep
        - how long I sleep
        - short sleeper
        - long sleeper
        - sleep length
        phenotypes:
          sleep_duration:
            label: Self-reported habitual sleep duration (hours per day)
            sign: 1
          short_sleep:
            label: Short sleep (dichotomized, e.g. <=6 h)
            sign: -1
          long_sleep:
            label: Long sleep (dichotomized, e.g. >=9 h)
            sign: 1
  kidney:
    label: Kidney
    concepts:
      kidney_function:
        label: Kidney function
        axis: better kidney filtration (higher eGFR)
        valence: desirable
        valence_basis: Higher filtration means healthier kidneys.
        status: agent_proposed
        aliases:
        - eGFR
        - renal function
        - kidney filtration
        - creatinine
        - cystatin C
        phenotypes:
          egfr:
            label: Estimated glomerular filtration rate (eGFR)
            sign: 1
          serum_creatinine:
            label: Serum creatinine (higher = lower filtration)
            sign: -1
          cystatin_c:
            label: Serum cystatin C (higher = lower filtration)
            sign: -1
      chronic_kidney_disease:
        label: Chronic kidney disease
        axis: higher risk of chronic kidney disease
        valence: undesirable
        valence_basis: CKD is progressive loss of kidney function.
        status: agent_proposed
        aliases:
        - CKD
        - kidney disease
        - renal failure
        - kidney failure
        phenotypes:
          chronic_kidney_disease:
            label: Chronic kidney disease (incl. stage 3+, ICD-10 N18, CKD or dialysis)
            sign: 1
          kidney_failure:
            label: Kidney failure / end-stage kidney disease
            sign: 1
  respiratory:
    label: Respiratory
    concepts:
      lung_function:
        label: Lung function
        axis: better lung function
        valence: desirable
        valence_basis: Higher spirometry values mean better breathing capacity.
        status: agent_proposed
        aliases:
        - spirometry
        - FEV1
        - FVC
        - breathing capacity
        - peak flow
        phenotypes:
          fev1:
            label: Forced expiratory volume in 1 second (FEV1)
            sign: 1
          fvc:
            label: Forced vital capacity (FVC)
            sign: 1
          fev1_fvc_ratio:
            label: FEV1/FVC ratio (low ratio = airflow obstruction)
            sign: 1
          pef:
            label: Peak expiratory flow (PEF)
            sign: 1
          fev1_percent_predicted:
            label: FEV1 as a percentage of the value predicted for age, sex and height
            sign: 1
          pef_percent_predicted:
            label: PEF relative to the predicted value
            sign: 1
      copd:
        label: Chronic obstructive pulmonary disease (COPD)
        axis: higher risk of COPD
        valence: undesirable
        valence_basis: COPD is a progressive lung disease.
        status: agent_proposed
        aliases:
        - COPD
        - emphysema
        - chronic bronchitis
        - airway obstruction
        phenotypes:
          copd:
            label: COPD or chronic airway obstruction (diagnosis)
            sign: 1
          emphysema:
            label: Emphysema (diagnosis)
            sign: 1
          family_history_copd:
            label: Parent or sibling with chronic bronchitis or emphysema
            sign: 1
      asthma:
        label: Asthma
        axis: higher risk of asthma
        valence: undesirable
        valence_basis: Asthma is a chronic inflammatory airway disease that limits breathing.
        status: agent_proposed
        aliases:
        - asthmatic
        - wheezing
        - allergic asthma
        - bronchial asthma
        - no asthma
        phenotypes:
          asthma:
            label: Asthma (any age; self-reported, doctor-diagnosed, ICD-10 J45 or incident)
            sign: 1
            aliases:
            - adult-onset asthma
            - doctor-diagnosed asthma
          childhood_asthma:
            label: Childhood-onset asthma
            sign: 1
            aliases:
            - pediatric asthma
            - asthma in children
          allergic_disease:
            label: Allergic disease (asthma, hay fever or eczema combined)
            sign: 1
            aliases:
            - atopy
            - allergies
            - hay fever and eczema
      asthma_onset_age:
        label: Age at asthma diagnosis
        axis: later age at asthma diagnosis
        valence: context_dependent
        valence_basis: Only defined for people who have asthma; earlier onset is typical of allergic childhood
          asthma, later onset of often more severe adult-onset asthma, so neither end is simply better.
        status: agent_proposed
        aliases:
        - asthma age of onset
        - when did asthma start
        - early-onset asthma
        - late-onset asthma
        phenotypes:
          age_asthma_diagnosed:
            label: Age (years) when asthma was first diagnosed (UK Biobank field 3786)
            sign: 1
  lipids:
    label: Blood lipids
    concepts:
      ldl_cholesterol:
        label: LDL cholesterol
        axis: higher LDL cholesterol
        valence: undesirable
        valence_basis: Higher LDL cholesterol causes atherosclerosis and coronary disease. Non-HDL cholesterol
          and apolipoprotein B are phenotypes here, not sibling concepts, because they measure the same
          atherogenic apoB-containing lipoproteins, correlate about 0.9 with LDL-C, and share its axis
          and valence.
        status: agent_proposed
        aliases:
        - LDL
        - bad cholesterol
        - LDL-C
        - apoB
        - non-HDL cholesterol
        phenotypes:
          ldl_cholesterol:
            label: LDL cholesterol level (incl. statin-adjusted and direct LDL)
            sign: 1
          non_hdl_cholesterol:
            label: Non-HDL cholesterol level
            sign: 1
          apolipoprotein_b:
            label: Apolipoprotein B level
            sign: 1
      triglycerides:
        label: Triglycerides
        axis: higher triglycerides
        valence: undesirable
        valence_basis: Higher fasting or non-fasting triglycerides mark triglyceride-rich lipoproteins
          that raise coronary disease and, at very high levels, pancreatitis risk. A separate concept
          from LDL cholesterol because it is a distinct lab value people ask about by name.
        status: agent_proposed
        aliases:
        - TG
        - blood fats
        - serum triglycerides
        - high triglycerides
        - hypertriglyceridemia
        phenotypes:
          triglycerides:
            label: Triglyceride level (incl. log-transformed)
            sign: 1
      total_cholesterol:
        label: Total cholesterol
        axis: higher total cholesterol
        valence: undesirable
        valence_basis: Higher total cholesterol, mostly carried in LDL, raises the risk of atherosclerosis
          and coronary disease. Kept apart from LDL cholesterol because total cholesterol also counts
          HDL, so the two are different lab values a person reads separately. Diagnosed or self-reported
          high cholesterol (hypercholesterolemia) is a phenotype here because it is defined by the same
          measurement.
        status: agent_proposed
        aliases:
        - TC
        - serum cholesterol
        - high cholesterol
        - blood cholesterol
        - hypercholesterolemia
        phenotypes:
          total_cholesterol:
            label: Total cholesterol level (incl. statin-adjusted)
            sign: 1
          hypercholesterolemia:
            label: High cholesterol / hypercholesterolemia (diagnosis or self-report)
            sign: 1
            aliases:
            - diagnosed high cholesterol
      hdl_cholesterol:
        label: HDL cholesterol
        axis: higher HDL cholesterol
        valence: desirable
        valence_basis: Higher HDL cholesterol is associated with lower coronary disease risk and is read
          as the favourable direction on a lipid panel, although raising HDL by drugs has not proven protective
          and very high levels are not clearly better. A separate concept from LDL and total cholesterol
          because it is its own lab value with the opposite desirable direction.
        status: agent_proposed
        aliases:
        - good cholesterol
        - HDL
        - HDL-C
        - low HDL
        - high-density lipoprotein
        phenotypes:
          hdl_cholesterol:
            label: HDL cholesterol level (incl. log-transformed and statin-adjusted)
            sign: 1
      lipoprotein_a:
        label: Lipoprotein(a)
        axis: higher lipoprotein(a)
        valence: undesirable
        valence_basis: Higher Lp(a) is a causal, largely genetically fixed risk factor for coronary disease,
          stroke and aortic stenosis. A separate concept from LDL cholesterol because it is its own lab
          value, set mainly by the LPA gene, that standard lipid panels do not report.
        status: agent_proposed
        aliases:
        - Lp(a)
        - lipoprotein little a
        - LPA
        - high Lp(a)
        - hyperlipoproteinemia(a)
        phenotypes:
          lipoprotein_a:
            label: Lipoprotein(a) concentration (nmol/L or mg/dL, incl. log-transformed)
            sign: 1
  cardiovascular:
    label: Heart and blood vessels
    concepts:
      blood_pressure:
        label: Blood pressure
        axis: higher blood pressure
        valence: undesirable
        valence_basis: Higher blood pressure raises the risk of stroke, heart attack and kidney disease.
        status: agent_proposed
        aliases:
        - high blood pressure
        - hypertension
        - SBP
        - DBP
        - low blood pressure
        - hypotension
        phenotypes:
          systolic_blood_pressure:
            label: Systolic blood pressure (mmHg, incl. medication-adjusted and automated readings)
            sign: 1
            aliases:
            - upper blood pressure number
            - SBP
          hypertension:
            label: Hypertension (diagnosis or treated high blood pressure)
            sign: 1
            aliases:
            - high blood pressure risk
            - essential hypertension
            - elevated blood pressure
            - normal blood pressure
          diastolic_blood_pressure:
            label: Diastolic blood pressure (mmHg, incl. medication-adjusted and automated readings)
            sign: 1
            aliases:
            - lower blood pressure number
            - bottom blood pressure number
            - DBP
            - diastolic pressure
      coronary_artery_disease:
        label: Coronary artery disease and heart attack
        axis: higher risk of coronary artery disease
        valence: undesirable
        valence_basis: Coronary artery disease narrows the heart's arteries and causes heart attacks;
          myocardial infarction is a phenotype here, not a sibling concept, because it is the main clinical
          event of the same disease and the scores correlate strongly in 1000G.
        status: agent_proposed
        aliases:
        - heart attack
        - CAD
        - coronary heart disease
        - ischemic heart disease
        - heart disease risk
        phenotypes:
          coronary_artery_disease:
            label: Coronary artery / coronary heart disease (incl. chronic ischaemic heart disease, ICD-10
              I25)
            sign: 1
            aliases:
            - CHD
            - IHD
            - blocked heart arteries
          myocardial_infarction:
            label: Myocardial infarction (heart attack; incl. acute MI I21, NSTEMI, PheCode 411.2)
            sign: 1
            aliases:
            - heart attack
            - MI
            - STEMI
            - NSTEMI
      atrial_fibrillation:
        label: Atrial fibrillation and flutter
        axis: higher risk of atrial fibrillation
        valence: undesirable
        valence_basis: Atrial fibrillation is an irregular heartbeat that raises the risk of stroke and
          heart failure.
        status: agent_proposed
        aliases:
        - AF
        - AFib
        - irregular heartbeat
        - heart rhythm disorder
        - arrhythmia
        phenotypes:
          atrial_fibrillation:
            label: Atrial fibrillation (incl. combined AF/flutter codes ICD-10 I48, PheCode 427.21; incident
              or prevalent)
            sign: 1
            aliases:
            - AFib
            - irregular heartbeat
          atrial_flutter:
            label: Atrial flutter
            sign: 1
            aliases:
            - flutter
          predicted_af_risk:
            label: Model-predicted 5-year atrial fibrillation risk (ECG-AI or CHARGE-AF clinical score),
              used as a GWAS trait
            sign: 1
            aliases:
            - CHARGE-AF
            - ECG-AI AF risk
      heart_rate:
        label: Resting heart rate (pulse)
        axis: higher resting heart rate
        valence: undesirable
        valence_basis: A higher resting heart rate is linked to higher cardiovascular and all-cause mortality
          in population studies.
        status: agent_proposed
        aliases:
        - pulse
        - resting pulse
        - heartbeat speed
        - slow heart rate
        - bradycardia
        phenotypes:
          resting_heart_rate:
            label: Resting heart rate / pulse rate (bpm; automated, manual, ECG or imaging readings, incl.
              log-transformed)
            sign: 1
            aliases:
            - beats per minute
            - fast pulse
      stroke:
        label: Stroke (any, ischaemic, haemorrhagic)
        axis: higher risk of stroke
        valence: undesirable
        valence_basis: A stroke (blocked or bleeding brain blood vessel) is a leading cause of death and
          disability.
        status: agent_proposed
        aliases:
        - brain attack
        - cerebrovascular accident
        - CVA
        - brain bleed
        - stroke risk
        phenotypes:
          any_stroke:
            label: Any stroke (all stroke types pooled; incl. 'stroke excluding subarachnoid haemorrhage')
            sign: 1
            aliases:
            - all stroke
          ischemic_stroke:
            label: Ischaemic stroke (incl. incident IS and IS in patients with atrial fibrillation)
            sign: 1
            aliases:
            - ischaemic stroke
            - cerebral infarction
          intracerebral_hemorrhage:
            label: Intracerebral haemorrhage (haemorrhagic stroke)
            sign: 1
            aliases:
            - hemorrhagic stroke
            - brain haemorrhage
          cerebrovascular_disease:
            label: Cerebrovascular disease (broad PheCode / ICD grouping incl. stroke)
            sign: 1
            aliases:
            - cerebrovascular disorder
  anthropometry:
