summary: '73 in-scope smoking scores: 64 annotated under substance_use.smoking (60) and a new substance_use.nicotine_dependence
  concept (4 tobacco-use-disorder scores); 1 out of scope (lung cancer in never smokers). The 16 GSCAN 2022 files (PGP000410)
  look allele-inverted as distributed: CHRNA5 and initiation lead variants carry the opposite sign, PGS003360 correlates -0.72
  with the anchor, and an independent evaluation of the downloaded files found negative TUD betas. The 9 scores with evidence
  are annotated as ''decreases''; 7 (AgeSmk non-EUR, all SmkCes) are left unannotated. The -0.98 trio (PGS001139/PGS001388/PGS001515)
  is real: ''light smokers'' tracks lighter smoking. PGS001139 and PGS001047 stay unannotated because their case groups sit
  mid-axis. Flip-worded scores resolved from UKB codings: never smoker (-), time to first cigarette (-), difficulty not smoking
  (+), age stopped smoking (+). No aligned-correlation conflicts remain.'
