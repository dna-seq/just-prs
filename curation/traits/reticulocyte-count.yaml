summary: 'All 33 in-scope scores (reticulocyte count, reticulocyte percentage, high light scatter reticulocyte count
  and percentage) sit in blood.reticulocyte_count and point the same way: a higher score means more reticulocytes.
  Eight seeds were read (Xu 2022 elastic net on trait level; Vuckovic 2020 GWAS-beta scores aligned to correlate
  positively with the trait); the other 25 are catalog-only, each correlating +0.47 to +0.81 with a same-phenotype
  seed in 1000G EUR. No negative correlations or direction splits were found. Mean reticulocyte volume, immature
  reticulocyte fraction and variance (vQTL) scores are out of scope and need their own concepts.'
