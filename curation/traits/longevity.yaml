summary: 'Lifespan scores run in two directions. Higher PGS000906 (longevity) and PGS001393 (father''s
  age at death) mean longer expected life; higher PGS000318/PGS000319 (all-cause mortality, female/male)
  mean shorter expected life, so they flip when aligned to ''longer life''. PGS002795 (4-SNP APOE longevity
  score) is unresolved: its weights conflict and no full text was available. PGS000718 is a drug-response
  score and out of scope.'
