summary: |
  Heel quantitative ultrasound scores (BUA, QUI, speed of sound, heel eBMD and T-score) from UK Biobank papers
  all sit under musculoskeletal.bone_density at sign +1: a higher score means a higher heel measurement, i.e. denser bone.
  The 16 new scores were annotated catalog-only from the paper templates and 1000G EUR correlations of +0.27 to +1.00
  with annotated heel BMD/BUA/SOS scores; a new phenotype heel_quantitative_ultrasound_index was added.
  No same-concept anti-correlations; osteoporosis (PGS002768) correlates negatively as expected and is out of scope here.
