summary: 'All 53 diastolic blood pressure scores (19 papers) are in scope and filed under cardiovascular.blood_pressure
  / diastolic_blood_pressure (new phenotype, sign +1): a higher score means higher diastolic blood pressure.
  51 are catalog-only, anchored on two scores with DBP betas whose CI excludes the null (PGS003964, PGS005351)
  and chained by 1000G EUR r >= 0.2; PGS003961 (African component) and PGS005317 reuse quotes from previously
  read full texts. No negative correlations and no inverted deposits (PGP000512 has no DBP scores). PGS005317
  goes to review: about half its loci are opposite to the same-GWAS score PGS002258 (partial allele inconsistency
  recorded). Low-correlation scores (BBJ, DBSLMM, AFR) were checked locally and their strongest loci agree
  with consensus.'
