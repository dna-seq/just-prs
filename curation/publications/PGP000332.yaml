  PGS002350:
    cluster: pigmentation.skin_tanning
    phenotype: tanning_ability
    measurement_kind: ordinal
    score_effect:
      direction: increases
      target: ease of skin tanning (tans more easily)
      coding: UKB 1727 presumed; whether the raw 1 (very tanned) .. 4 (never tan) order was reversed is not stated
        in any reachable source
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: catalog
      locator: scores.name
      quote: pigment_TANNING.BOLT-LMM
      confidence: low
    lead_variant_check:
      status: agree
      note: IRF4 rs12203592-T, HERC2 rs12913832-G and MC1R rs1805007-T (all lighter/burn-prone) carry negative weights
    status: agent_proposed
    notes: 'BOLT-LMM. Catalog-only: the paper and the reachable Price-lab docs do not give the coding of pigment_TANNING.
      Direction read from the catalog label "Tanning" (EFO suntan) plus lead variants (lighter-pigmentation alleles
      negative) and 1000G EUR r=+0.85 with "get very tanned" (PGS001246) and -0.85 with Prive "less_tanned" (PGS002155).
      If the trait kept raw UKB 1727 coding the label would be misleading, but the weights still point to easier
      tanning.'
