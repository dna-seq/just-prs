      quote: Idiopathic pulmonary fibrosis
      confidence: medium
    lead_variant_check:
      status: agree
      note: DSP rs2076295 G (IPF risk, GWAS Catalog OR 1.44-1.49) +0.0315 here; TERT rs10069690 C (increases postinflammatory
        pulmonary fibrosis, PMID 39024449) +0.0357. MUC5B rs35705950 is not among the top 40 weights (likely absent
        from the HapMap3-based PRS-CS set). rs35678986 / rs5744034 have no GWAS Catalog record; both are opposite
        to the inverted PGS005323.
    review_reason: null
    corrections: []
    status: agent_proposed
    notes: GBMI leave-UKBB-out IPF meta-analysis, PRS-CS-auto (1KG-EUR LD). The paper does not state the effect
      allele; direction follows PRS-CS posterior effects on IPF risk and the DSP/TERT lead loci. 1000G EUR r is
      weak with the other IPF scores (+0.12 to +0.17) because the sparse scores are dominated by MUC5B rs35705950,
      which this file lacks; r = -0.10 with the inverted PGS005323.
