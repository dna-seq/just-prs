      evidence: 'Paper Table 3: PRS-CSx cholelithiasis perSD OR 1.19 [1.14-1.25]. File: 6/6 variants shared with
        PGS001174 opposite (UGT1A1 rs4148325, GCKR rs1260326, TM4SF4 rs2290846/rs3749574, rs1105879, rs7908745);
        ABCG5/8 rs4953023-A/rs41360247-C negative vs positive in PGS004476/4546; 1000G EUR r = -0.33 vs three UKB
        gallstone scores. Same pattern as this paper''s asthma (PGS005141/5148) and stroke (PGS005156) deposits.'
      recorded: '2026-10-26'
      by: agent
      upstream_report: null
    - kind: metric_not_from_file
