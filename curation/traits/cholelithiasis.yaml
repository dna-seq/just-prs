summary: 'Four gallstone (cholelithiasis) scores, all in digestive.gallstones. PGS001174 (UKB snpnet, D19H rs11887534-C
  top weight), PGS004476 and PGS004546 (UKB K80 disease / meta PRS, OR 1.22 / 1.30) mean higher = more gallstone risk.
  PGS005150 (PRS-CSx EAS+EUR, Jung 2025) is the odd one: the paper reports perSD OR 1.19 but every variant shared with
  PGS001174 carries the opposite sign and it correlates -0.33 with the UKB scores, so it is recorded as an inverted
  deposit (higher file score = lower risk) and sent to review, like the same paper''s asthma and stroke files.
  Cholecystitis and combined gallstones+cholecystitis scores are left to their own groups.'
