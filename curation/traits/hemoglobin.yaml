summary: '25 hemoglobin-concentration scores from 12 papers map to blood.hemoglobin (higher score = higher
  blood hemoglobin). All were annotated catalog-only: PGP000679 scores carry a positive beta on hemoglobin
  with CI excluding the null, and every other score correlates positively (r 0.45-0.69 max) with them
  in 1000G EUR; no negative pairs among in-scope scores. MCH/MCHC red-cell indices, HbA1c, vitamin B12
  deficiency anaemia and variance (vQTL) scores are out of scope. Valence is context dependent: both anaemia
  and polycythemia are unwanted.'
