summary: '13 in-scope allergic-disease scores, all annotated (12 new, catalog-only or Tanigawa biobank template).
  Scores built on the shared asthma/hay fever/eczema GWAS (PGS000780, PGS000800, PGS000810, PGS003458 and its IL-4/IL-12/IL-17
  subsets) sit in respiratory.asthma.allergic_disease; UK Biobank hay fever/eczema scores and the childhood-allergy
  GRS sit in the new immune.allergic_disease concept. Higher score = more likely allergic. All 16 negative 1000G
  pairs involve PGS001283 and PGS001372, which are age-at-diagnosis scores (UKB 3761, 22146) despite PGS001283 being
  labelled "Allergic disease" in the catalog: higher = later diagnosis, so anti-correlation with risk scores is
  expected, not a sign flip. No lookups were needed.'
