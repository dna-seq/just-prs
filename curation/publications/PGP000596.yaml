    review_reason: 'Suspected inverted deposit: 15q25 and 19q13 lead loci opposite to known risk alleles; r=-0.69
      with PGS004860, -0.4 to -0.5 with the lung-cancer consensus.'
    corrections:
    - kind: deposit_inverted
      action: polarity_as_distributed
      effect: Direction describes the file as distributed (higher = lower lung-cancer risk); the paper says higher
        = increases.
      paper_direction: increases
      evidence: 15q25 CHRNA5 risk alleles (rs16969968 A, rs1051730 A/T, rs951266 A, rs2036527 A) all negative; 19q13
        rs11879413 T opposite to PGS004860; 1000G EUR r=-0.69 with PGS004860 and -0.4 to -0.54 with 12 consensus
        lung-cancer scores; r=+0.8 with PGS005397 (same pattern).
      recorded: '2026-10-19'
      by: agent
      upstream_report: null
    - kind: metric_not_from_file
      action: discount_metrics
      effect: The paper's HR/AUROC describe the authors' (correctly oriented) score, not the deposited file.
      evidence: Same as deposit_inverted.
      recorded: '2026-10-19'
      by: agent
      upstream_report: null
    status: agent_proposed
    notes: LDpred2 PRS from non-UKB public GWAS, tuned in UKB. The paper gives all non-ovarian PRS HRs > 1 (lung
      HR only in Supplementary Figure 4, not read), so its score increases risk; the deposited file behaves as the
      negated score.
