    unannotated_reason: 'Suspected sign flip, lookup pending: labelled CKD (OR 1.15 [1.05,1.26]) but named eGFR_prscs;
      1000G EUR r=+0.91 with eGFR scores and -0.91 with PGP000517 CKD scores, so the weights look eGFR-direction.'
