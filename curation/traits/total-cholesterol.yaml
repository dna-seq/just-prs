summary: '82 in-scope scores sit in a new concept lipids.total_cholesterol (axis higher total cholesterol,
  undesirable): 70 total-cholesterol level scores and 12 high-cholesterol / hypercholesterolemia scores.
  Higher score = higher total cholesterol (or more likely high cholesterol) for all but one; most are
  catalog-only, seeded by CI-excluding betas (PGP000393, PGS000658) and an OR 1.72 for hypercholesterolemia
  (PGS002764), then 1000G EUR r >= +0.2, plus a lead-SNP sign check. PGS000062 (PGP000045 GRS_TC) is an
  inverted deposit like PGS000061 for LDL: 6/6 reference loci flipped, r about -0.7 with other TC scores,
  so higher = lower TC (review). PGS003822/3827/3832 (PGP000489 weighted LDpred2) are broken deposits
  and stay unannotated (quarantine). The 8 Price-lab disease_HI_CHOL_SELF_REP scores (PGP000332) have
  no documented case coding and go to review. GS9 (PGS000192) is out of scope as an LDL+HDL composite.'
