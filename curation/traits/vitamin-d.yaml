summary: 44 "vitamin D" scores from 7 papers. 34 are serum 25-hydroxyvitamin D scores (nutrition.vitamin_d); 32
  are annotated "higher score = higher vitamin D level", mostly catalog-only, anchored on PGS000702 (OR 0.09 per
  unit against deficiency) and PGS000882 (developer betas on 25OHD). Ten ExPRSweb scores built on UK Biobank field
  100021 are dietary vitamin D intake from a 24-hour recall, not serum level, and go to a separate concept (nutrition.vitamin_d_intake);
  four are annotated, six are near-null and left unannotated. Two ExPRSweb DBSLMM serum scores (PGS003187, PGS003202)
  are near-null with negative evaluation betas and stay unannotated. No aligned-correlation conflicts.
