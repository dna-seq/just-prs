version: 0
domains:
  aging:
    label: Aging
    concepts:
      lifespan:
        label: Lifespan and survival
        axis: longer life
        valence: desirable
        valence_basis: Longer survival is the outcome people want.
        status: agent_proposed
        aliases:
        - longevity
        - life expectancy
        - life span
        - mortality
        - age at death
        phenotypes:
          longevity:
            label: Survival to old age / longer lifespan
            sign: 1
          all_cause_mortality:
            label: Death from any cause
            sign: -1
          parental_age_at_death:
            label: Parent's age at death (proxy for own lifespan)
            sign: 1
  endocrine:
    label: Endocrine and metabolic
    concepts:
      type_1_diabetes:
        label: Type 1 diabetes
        axis: higher risk of type 1 diabetes
        valence: undesirable
        valence_basis: Type 1 diabetes is a lifelong autoimmune disease requiring insulin.
        status: agent_proposed
        aliases:
        - T1D
        - juvenile diabetes
        - insulin-dependent diabetes
        phenotypes:
          type_1_diabetes:
            label: Type 1 (insulin-dependent) diabetes
            sign: 1
      type_2_diabetes:
        label: Type 2 diabetes
        axis: higher risk of type 2 diabetes
        valence: undesirable
        valence_basis: Type 2 diabetes is a chronic metabolic disease with vascular, kidney and eye complications.
        status: agent_proposed
        aliases:
        - adult-onset diabetes
        - high blood sugar
        - insulin resistance diabetes
        - diabetes risk
        phenotypes:
          type_2_diabetes:
            label: Type 2 (non-insulin-dependent) diabetes
            sign: 1
            aliases:
            - incident type 2 diabetes
            - early-onset type 2 diabetes
          genetic_beta_cell_function:
            label: Genetically determined beta cell function (insulin secretion)
            sign: -1
            aliases:
            - insulin secretion
            - beta cell function
            - insulin response
            - insulin secretion rate
            - poor insulin production
      glycemia:
        label: Blood sugar (glycemia)
        axis: higher blood sugar
        valence: undesirable
        valence_basis: Higher glycemia is the direction of diabetes and its complications.
        status: agent_proposed
        aliases:
        - blood sugar
        - blood glucose
        - sugar levels
        - low blood sugar
        - long-term blood sugar
        phenotypes:
          hba1c:
            label: Glycated haemoglobin (HbA1c)
            sign: 1
            aliases:
            - A1c
            - average blood sugar over three months
            - glycated hemoglobin
          fasting_glucose:
            label: Fasting blood glucose
            sign: 1
            aliases:
            - fasting blood sugar
            - FPG
            - morning blood sugar
            - glucose level
          random_glucose:
            label: Non-fasting (random) blood glucose
            sign: 1
            aliases:
            - non-fasting glucose
            - random blood sugar
            - serum glucose
      gout:
        label: Gout
        axis: higher risk of gout
        valence: undesirable
        valence_basis: Gout is a painful inflammatory arthritis caused by urate crystal deposition.
        status: agent_proposed
        aliases:
        - gouty arthritis
        - hyperuricemia
        - high uric acid
        - urate crystals
        phenotypes:
          gout:
            label: Gout (diagnosis or incident gout)
            sign: 1
            aliases:
            - incident gout
            - gout attack
          serum_urate:
            label: Serum or plasma urate (uric acid) level
            sign: 1
            aliases:
            - uric acid
            - serum uric acid
            - blood urate
      hypothyroidism:
        label: Hypothyroidism (underactive thyroid)
        axis: higher risk of an underactive thyroid
        valence: undesirable
        valence_basis: Hypothyroidism is a chronic disease needing lifelong hormone replacement.
        status: agent_proposed
        aliases:
        - underactive thyroid
        - low thyroid
        - Hashimoto
        - levothyroxine
        - myxoedema
        phenotypes:
          hypothyroidism:
            label: Hypothyroidism (diagnosed, self-reported or time to diagnosis)
            sign: 1
          autoimmune_thyroiditis:
            label: Lymphocytic (Hashimoto) thyroiditis, the autoimmune cause of hypothyroidism
            sign: 1
            aliases:
            - Hashimoto's thyroiditis
            - autoimmune thyroiditis
          thyroid_medication_use:
            label: Thyroid medication use (mostly levothyroxine replacement)
            sign: 1
            aliases:
            - thyroxine tablets
          thyroid_disorder_self_reported:
            label: Any self-reported thyroid condition (UK Biobank; mostly hypothyroidism)
            sign: 1
            aliases:
            - thyroid problem
      hyperthyroidism:
        label: Hyperthyroidism (overactive thyroid)
        axis: higher risk of an overactive thyroid
        valence: undesirable
        valence_basis: Hyperthyroidism and Graves' disease cause heart, bone and eye complications.
        status: agent_proposed
        aliases:
        - overactive thyroid
        - Graves
        - thyrotoxicosis
        - toxic goitre
        phenotypes:
          hyperthyroidism:
            label: Hyperthyroidism or thyrotoxicosis (with or without goitre)
            sign: 1
          graves_disease:
            label: Graves' disease (autoimmune hyperthyroidism)
            sign: 1
            aliases:
            - Basedow disease
      goiter:
        label: Goitre and thyroid nodules
        axis: higher risk of an enlarged or nodular thyroid
        valence: undesirable
        valence_basis: Goitre and nodules need monitoring and sometimes surgery.
        status: agent_proposed
        aliases:
        - goiter
        - enlarged thyroid
        - thyroid nodules
        - multinodular goitre
        phenotypes:
          nontoxic_goiter:
            label: Non-toxic (multinodular) goitre
            sign: 1
          benign_nodular_goiter:
            label: Benign nodular goiter
            sign: 1
      thyroid_function:
        label: Thyroid hormone levels (thyroid function)
        axis: more thyroid hormone activity (higher free T4, lower TSH)
        valence: context_dependent
        valence_basis: Both too little and too much thyroid hormone are harmful; the normal range is best.
        status: agent_proposed
        aliases:
        - thyroid function test
        - TSH
        - free T4
        - thyroxine level
        phenotypes:
          free_thyroxine:
            label: Free thyroxine (FT4) concentration
            sign: 1
          tsh_level:
            label: Thyroid stimulating hormone (TSH) concentration; high TSH signals an underactive thyroid
            sign: -1
            aliases:
            - thyrotropin
      adrenal_insufficiency:
        label: Adrenal insufficiency (Addison's disease)
        axis: higher risk of adrenal insufficiency
        valence: undesirable
        valence_basis: Primary adrenal insufficiency is a life-threatening loss of cortisol production
          that needs lifelong hormone replacement.
        status: agent_proposed
        aliases:
        - Addison's disease
        - adrenal failure
        - low cortisol
        phenotypes:
          autoimmune_addisons_disease:
            label: Autoimmune Addison's disease (autoimmune primary adrenal insufficiency)
            sign: 1
  cognition:
    label: Cognition
    concepts:
      cognitive_ability:
        label: Cognitive ability
        axis: higher cognitive test performance
        valence: neutral
        valence_basis: Test performance is a trait, not a health outcome; left uncolored to avoid ranking
          people.
        status: agent_proposed
        aliases:
        - intelligence
        - IQ
        - general cognitive ability
        - reasoning
        phenotypes:
          fluid_intelligence:
            label: Fluid intelligence (reasoning test score)
            sign: 1
          intelligence_quotient:
            label: Intelligence quotient (IQ)
            sign: 1
          executive_function:
            label: Common executive function
            sign: 1
  pigmentation:
    label: Pigmentation and appearance
    concepts:
      skin_tanning:
        label: Skin tanning ability
        axis: tans more easily
        valence: neutral
        valence_basis: Appearance trait; poor tanning raises skin-cancer risk, but that is a separate
          concept.
        status: agent_proposed
        aliases:
        - tanning
        - suntan
        - sunburn
        - burns easily
        - skin type
        phenotypes:
          tanning_ability:
            label: Overall ease of tanning (ordinal UKB 1727 treated as a scale)
            sign: 1
          tan_very:
            label: Gets very tanned (UKB 1727 answer 1)
            sign: 1
          tan_moderate:
            label: Gets moderately tanned (UKB 1727 answer 2)
            sign: 1
          tan_mild:
            label: Gets mildly or occasionally tanned (UKB 1727 answer 3)
            sign: -1
          never_tan_only_burn:
            label: Never tans, only burns (UKB 1727 answer 4)
            sign: -1
          childhood_sunburn:
            label: Childhood sunburn occasions before age 15 (UKB 1737)
            sign: -1
      hair_color:
        label: Hair color
        axis: darker hair
        valence: neutral
        valence_basis: Appearance trait with no health ranking.
        status: agent_proposed
        aliases:
        - hair colour
        - blonde
        - brunette
        - dark hair
        - light hair
        phenotypes:
          hair_darkness:
            label: Natural hair darkness (ordinal scale)
            sign: 1
          black_hair:
            label: Black natural hair (UKB 1747 = 5)
            sign: 1
          dark_brown_hair:
            label: Dark brown natural hair (UKB 1747 = 4)
            sign: 1
          brown_hair:
            label: Brown natural hair (GBE grouping of UKB 1747)
            sign: 1
          light_brown_hair:
            label: Light brown natural hair (UKB 1747 = 3)
            sign: -1
          blonde_hair:
            label: Blonde natural hair (UKB 1747 = 1)
            sign: -1
      red_hair:
        label: Red hair
        axis: red hair
        valence: neutral
        valence_basis: Appearance trait with no health ranking.
        status: agent_proposed
        aliases:
        - ginger hair
        - redhead
        - red hair colour
        phenotypes:
          red_hair:
            label: Red natural hair (UKB 1747 = 2)
            sign: 1
      male_pattern_baldness:
        label: Male pattern baldness
        axis: more balding
        valence: neutral
        valence_basis: Appearance trait with no health ranking; many men would rather keep their hair,
          but balding itself is not a disease.
        status: agent_proposed
        aliases:
        - hair loss
        - androgenetic alopecia
        - going bald
        - receding hairline
        - keeping my hair
        phenotypes:
          balding_pattern:
            label: Hair/balding pattern in men (UKB 2395 pattern 1-4 treated as a scale)
            sign: 1
          balding_pattern_1:
            label: Balding pattern 1 in men (UKB 2395 = 1)
            sign: -1
  lifestyle:
    label: Lifestyle and behavior
    concepts:
      sun_exposure:
        label: Sun exposure and protection
        axis: more sun exposure
        valence: context_dependent
        valence_basis: More UV exposure raises skin-cancer risk but also vitamin D; sun protection is
          the reverse side of the same axis.
        status: agent_proposed
        aliases:
        - sunscreen
        - sun protection
        - time outdoors
        - UV exposure
        phenotypes:
          sun_protection_use:
            label: Use of sun/UV protection (ordinal UKB 2267 treated as a scale, more protection)
            sign: -1
          sun_protection_never_rarely:
            label: Never or rarely uses sun protection (UKB 2267 answer 1)
            sign: 1
          sun_protection_sometimes:
            label: Sometimes uses sun protection (UKB 2267 answer 2)
            sign: 1
          sun_protection_always:
            label: Always uses sun protection (UKB 2267 answer 4)
            sign: -1
          time_outdoors_summer:
            label: Hours per day spent outdoors in summer (UKB 1050)
            sign: 1
          time_outdoors_winter:
            label: Hours per day spent outdoors in winter (UKB 1060)
            sign: 1
      coffee_consumption:
        label: Coffee consumption
        axis: more coffee drinking
        valence: neutral
        valence_basis: Habitual coffee intake is a dietary preference; moderate intake is not considered
          harmful for most adults and caffeine tolerance varies.
        status: agent_proposed
        aliases:
        - coffee intake
        - caffeine intake
        - cups of coffee per day
        - coffee drinker
        - non coffee drinker
        phenotypes:
          coffee_intake:
            label: Cups of coffee per day (UKB 1498, decaffeinated included)
            sign: 1
          coffee_drunk_yesterday:
            label: Drank any coffee yesterday (UKB 100240, 24-hour diet recall; yes = case)
            sign: 1
      coffee_type:
        label: Type of coffee usually drunk
        axis: prefers ground (brewed) coffee over instant coffee
        valence: neutral
        valence_basis: Coffee type is a taste and habit preference with no clear health ranking.
        status: agent_proposed
        aliases:
        - instant coffee
        - ground coffee
        - espresso or filter coffee
        - coffee preference
        phenotypes:
          ground_coffee:
            label: Usually drinks ground coffee incl. espresso and filter (UKB 1508 answer 3 vs other
              answers)
            sign: 1
          instant_coffee:
            label: Usually drinks instant coffee (UKB 1508 answer 2 vs other answers)
            sign: -1
      meat_intake:
        label: Meat intake
        axis: eats meat more often
        valence: context_dependent
        valence_basis: Meat is a normal protein source, but frequent red and processed meat is linked
          to colorectal cancer and heart disease; the score measures a habit, not harm.
        status: agent_proposed
        aliases:
        - red meat consumption
        - how often I eat meat
        - meat eater
        - vegetarian tendency
        phenotypes:
          beef_intake:
            label: Beef intake frequency (UKB 1369, never ... once or more daily)
            sign: 1
          poultry_intake:
            label: Poultry intake frequency (UKB 1359, never ... once or more daily)
            sign: 1
          processed_meat_intake:
            label: Processed meat intake frequency (UKB 1349, never ... once or more daily)
            sign: 1
      fish_intake:
        label: Fish intake
        axis: eats oily fish more often
        valence: neutral
        valence_basis: A dietary habit; the score predicts reported intake, not omega-3 status or health.
        status: agent_proposed
        aliases:
        - oily fish consumption
        - salmon and mackerel
        - fish eater
        - seafood intake
        phenotypes:
          oily_fish_intake:
            label: Oily fish intake frequency (UKB 1329, never ... once or more daily)
            sign: 1
      fruit_vegetable_intake:
        label: Fruit and vegetable intake
        axis: eats more fruit and vegetables
        valence: neutral
        valence_basis: A reported eating habit; the paper does not link the score to a health outcome.
        status: agent_proposed
        aliases:
        - fruit consumption
        - vegetable consumption
        - five a day
        - plant food intake
        phenotypes:
          fresh_fruit_intake:
            label: Pieces of fresh fruit per day (UKB 1309)
            sign: 1
          dried_fruit_intake:
            label: Pieces of dried fruit per day (UKB 1319)
            sign: 1
          cooked_vegetable_intake:
            label: Tablespoons of cooked vegetables per day (UKB 1289)
            sign: 1
      dairy_intake:
        label: Cheese and dairy intake
        axis: eats cheese more often
        valence: neutral
        valence_basis: A dietary habit with no clear health ranking.
        status: agent_proposed
        aliases:
        - cheese consumption
        - dairy consumption
        - how often I eat cheese
        phenotypes:
          cheese_intake:
            label: Cheese intake frequency (UKB 1408, never ... once or more daily)
            sign: 1
      milk_type:
        label: Type of milk used
        axis: uses skimmed milk
        valence: neutral
        valence_basis: Milk type is a taste and habit choice.
        status: agent_proposed
        aliases:
        - skimmed milk
        - low fat milk
        - milk preference
        phenotypes:
          skimmed_milk:
            label: Usually uses skimmed milk (UKB 1418 answer 3 vs any other answer)
            sign: 1
      carbohydrate_intake:
        label: Bread, cereal and carbohydrate intake
        axis: eats more carbohydrate-rich food
        valence: neutral
        valence_basis: Carbohydrate intake is a dietary pattern; neither more nor less is good for everyone.
        status: agent_proposed
        aliases:
        - carbs
        - starchy food
        - bread consumption
        - breakfast cereal
        - carbohydrate preference
        phenotypes:
          bread_intake:
            label: Slices of bread per week (UKB 1438)
            sign: 1
          cereal_intake:
            label: Bowls of breakfast cereal per week (UKB 1458)
            sign: 1
          relative_carbohydrate_intake:
            label: Relative carbohydrate intake (share of energy from carbohydrate; Merino 2022 GWAS loci)
            sign: 1
      cereal_type:
        label: Type of breakfast cereal
        axis: prefers biscuit-type cereal (e.g. Weetabix) over cornflake-type cereal
        valence: neutral
        valence_basis: A taste preference among cereal eaters.
        status: agent_proposed
        aliases:
        - Weetabix
        - cornflakes
        - cereal preference
        phenotypes:
          biscuit_cereal:
            label: Usually eats biscuit cereal such as Weetabix (UKB 1468 answer 2 vs other cereal types)
            sign: 1
          other_cereal:
            label: Usually eats other cereal such as Cornflakes or Frosties (UKB 1468 answer 5 vs other
              cereal types)
            sign: -1
      salt_added:
        label: Salt added to food
        axis: adds salt to food more often
        valence: context_dependent
        valence_basis: High salt intake raises blood pressure in many people, but the score measures a
          table habit, not total salt intake.
        status: agent_proposed
        aliases:
        - salting food
        - salt use
        - salty food
        phenotypes:
          salt_added_to_food:
            label: Adds salt to food (UKB 1478, never/rarely ... always)
            sign: 1
      tea_consumption:
        label: Tea consumption
        axis: drinks more tea
        valence: neutral
        valence_basis: Habitual tea drinking is a beverage preference without a clear health ranking.
        status: agent_proposed
        aliases:
        - tea intake
        - cups of tea per day
        - tea drinker
        phenotypes:
          tea_intake:
            label: Cups of tea per day (UKB 1488)
            sign: 1
      water_intake:
        label: Water intake
        axis: drinks more water
        valence: neutral
        valence_basis: Water intake depends on thirst, climate and other drinks; more is not better for
          everyone.
        status: agent_proposed
        aliases:
        - glasses of water per day
        - hydration
        - drinking water
        - thirst
        phenotypes:
          water_intake:
            label: Glasses of water per day (UKB 1528)
            sign: 1
      food_avoidance:
        label: Never eating a food group
        axis: avoids a food group entirely
        valence: context_dependent
        valence_basis: Avoiding wheat or sugar is often a response to coeliac disease or diabetes, but
          it can also be a choice.
        status: agent_proposed
        aliases:
        - sugar free diet
        - gluten free diet
        - never eat wheat
        - never eat sugar
        phenotypes:
          never_eat_sugar:
            label: Never eats sugar or foods/drinks containing sugar (UKB 6144 answer 4)
            sign: 1
          never_eat_wheat:
            label: Never eats wheat products (UKB 6144 answer 3)
            sign: 1
      supplement_use:
        label: Dietary supplement use
        axis: takes the supplement
        valence: neutral
        valence_basis: Supplement use reflects habits and health concerns, not a health outcome.
        status: agent_proposed
        aliases:
        - vitamins
        - supplements
        - glucosamine
        - folic acid
        phenotypes:
          glucosamine_use:
            label: Takes glucosamine (UKB 6179 answer 2)
            sign: 1
          folic_acid_supplement_use:
            label: Takes folic acid / vitamin B9 supplement (UKB 6155 answer 6)
            sign: 1
      diet_variation:
        label: Variation in diet
        axis: diet varies more from week to week
        valence: neutral
        valence_basis: A description of eating routine, not of diet quality.
        status: agent_proposed
        aliases:
        - varied diet
        - eating routine
        - same food every week
        phenotypes:
          variation_in_diet:
            label: Diet varies week to week (UKB 1548, 1 never/rarely, 2 sometimes, 3 often)
            sign: 1
      portion_size:
        label: Portion size
        axis: eats larger portions
        valence: neutral
        valence_basis: Self-rated portion size relative to others; context (body size, activity) decides
          whether it matters.
        status: agent_proposed
        aliases:
        - big eater
        - meal size
        - how much I eat
        phenotypes:
          portion_size:
            label: Self-rated portion size in 24-hour recall (UKB 100010, smaller / average / larger)
            sign: 1
      dietary_change:
        label: Diet changed because of illness
        axis: changed diet because of illness
        valence: context_dependent
        valence_basis: Reflects having had an illness that needed a diet change (for example diabetes);
          the change itself may be beneficial.
        status: agent_proposed
        aliases:
        - diet change for health reasons
        - medical diet
        - changed eating habits
        phenotypes:
          dietary_change_due_to_illness:
            label: Major dietary change in the last 5 years because of illness (UKB 1538 answer 1)
            sign: 1
  substance_use:
    label: Substance use
    concepts:
      smoking:
        label: Smoking
        axis: more smoking
        valence: undesirable
        valence_basis: Smoking is the leading preventable cause of disease and death.
        status: agent_proposed
        aliases:
        - tobacco
        - cigarettes
        - smoker
        - never smoker
        - quitting smoking
        phenotypes:
          ever_smoked:
            label: Ever smoked (ever vs never; includes smoking initiation = ever a regular smoker)
            sign: 1
          never_smoker:
            label: Never smoked (never smokers are the cases)
            sign: -1
          smoking_status:
            label: Smoking status (ever/never or never/previous/current; exact coding not stated)
            sign: 1
          previous_smoker:
            label: Former smoker vs everyone else (controls are mostly never smokers plus current smokers)
            sign: 1
          current_smoker:
            label: Current smoker (vs everyone else)
            sign: 1
          cigarettes_per_day:
            label: Cigarettes smoked per day
            sign: 1
          difficulty_abstaining:
            label: 'Difficulty going without smoking for a day (UKB 3476: 1 very easy to 4 very difficult)'
            sign: 1
          time_to_first_cigarette:
            label: Time from waking to first cigarette (longer time = lighter dependence)
            sign: -1
          age_stopped_smoking:
            label: Age stopped smoking (later quitting = longer smoking career)
            sign: 1
          age_at_smoking_initiation:
            label: Age at starting regular smoking (later start = less smoking)
            sign: -1
      alcohol_consumption:
        label: Alcohol consumption
        axis: more alcohol drinking
        valence: undesirable
        valence_basis: Alcohol harm rises with the amount consumed.
        status: agent_proposed
        aliases:
        - drinking
        - alcohol intake
        - drinks per week
        phenotypes:
          alcohol_quantity:
            label: Amount of alcohol drunk (drinks per week, grams, typical-day amount, AUDIT-C)
            sign: 1
          alcohol_intake_frequency:
            label: How often alcohol is drunk
            sign: 1
          current_drinker:
            label: Being a current drinker rather than a never or former drinker
            sign: 1
          drinking_more_than_before:
            label: Drinking more now than 10 years ago
            sign: 1
      alcohol_use_disorder:
        label: Alcohol use disorder
        axis: higher risk of problematic alcohol use
        valence: undesirable
        valence_basis: Alcohol dependence and problematic use are clinical disorders.
        status: agent_proposed
        aliases:
        - alcoholism
        - alcohol dependence
        - problem drinking
        - alcohol addiction
        phenotypes:
          alcohol_use_disorder:
            label: Alcohol use disorder or dependence (DSM diagnosis or criterion count, ICD-10 F10)
            sign: 1
          problematic_alcohol_use:
            label: Problematic alcohol use (AUDIT-P problems score, PAU meta-analysis phenotype)
            sign: 1
      nicotine_dependence:
        label: Nicotine dependence (tobacco use disorder)
        axis: more nicotine dependence
        valence: undesirable
        valence_basis: Tobacco use disorder is a diagnosed addiction that drives continued smoking and
          its harms.
        status: agent_proposed
        aliases:
        - nicotine addiction
        - tobacco use disorder
        phenotypes:
          tobacco_use_disorder:
            label: Tobacco use disorder / ICD-10 F17 / nicotine dependence diagnosis
            sign: 1
      nicotine_metabolism:
        label: Nicotine metabolism rate (CYP2A6 activity)
        axis: faster nicotine metabolism
        valence: context_dependent
        valence_basis: Faster metabolizers tend to smoke more and quit less easily on nicotine patch,
          but the rate itself is a drug-metabolism trait, not a disease.
        status: agent_proposed
        aliases:
        - CYP2A6 activity
        - nicotine clearance
        - slow nicotine metabolizer
        - fast nicotine metabolizer
        - 3-hydroxycotinine to cotinine ratio
        phenotypes:
          nicotine_metabolite_ratio:
            label: Nicotine metabolite ratio (3'-hydroxycotinine / cotinine)
            sign: 1
            aliases:
            - NMR
      addiction_liability:
        label: General addiction liability (substance use disorders)
        axis: higher general risk of addiction
        valence: undesirable
        valence_basis: A shared genetic liability to alcohol, tobacco, opioid, cannabis and cocaine use
          disorders.
        status: agent_proposed
        aliases:
        - addiction
        - substance use disorder
        - drug addiction
        - addictive behaviour
        - polysubstance use
        phenotypes:
          addiction_risk_factor:
            label: Addiction risk factor (addiction-rf; genomic SEM common factor across OUD, PAU, problematic
              tobacco use and CUD)
            sign: 1
          ever_addicted:
            label: Ever addicted to any substance or behaviour (UKB 20401, yes vs no)
            sign: 1
            aliases:
            - ever been addicted
            - addiction history
  sleep:
    label: Sleep
    concepts:
      chronotype:
        label: Chronotype (morning vs evening person)
        axis: more of a morning person
        valence: neutral
        valence_basis: A circadian preference, not a health outcome.
        status: agent_proposed
        aliases:
        - morning person
        - evening person
        - night owl
        - early bird
        - lark
        phenotypes:
          morningness:
            label: Morning person (morning chronotype)
            sign: 1
          eveningness:
            label: Evening person (evening chronotype)
            sign: -1
          ease_getting_up:
            label: Ease of getting up in the morning
            sign: 1
      sleep_duration:
        label: Sleep duration (hours of sleep)
        axis: longer habitual sleep
        valence: context_dependent
        valence_basis: U-shaped; both short (<7 h) and long (>9 h) sleep are associated with worse health,
          so neither end is simply good.
        status: agent_proposed
        aliases:
        - hours of sleep
        - how long I sleep
        - short sleeper
        - long sleeper
        - sleep length
        phenotypes:
          sleep_duration:
