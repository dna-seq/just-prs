    notes: Catalog-only annotation (paper not read). Common plus rare/low-frequency variant GRS (ALLGRS) for fasting
      plasma glucose from the Korean East Asian GWAS; PGS Catalog weights are per-allele effects on the reported
      trait. Corroborated by 1000G EUR r = +1.00 with PGS003336 (rare variants absent in 1000G), +0.34 with PGS000305
      and +0.38 with PGS000306 (both read), plus catalog beta +0.207 against FPG in East Asians (no CI reported).
