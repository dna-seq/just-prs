      coding: null
    polarity: 1
    evaluation_outcome:
      expected_metric_sign: -1
      basis: authors report that a higher SBP score is associated with lower discontinuation of dihydropyridine
        CCB prescribing (HR 0.96 per SD)
    strata: {}
    provenance:
    - source: full_text
      locator: Introduction
      quote: derived by summing the number of trait-increasing alleles they carry and weighting each variant’s contribution
        according to its effect size
      confidence: medium
    - source: full_text
      locator: Discussion
      quote: high SBP and DBP polygenic scores are associated with decreased the risk of discontinuation
      confidence: medium
    lead_variant_check:
      status: mixed
      note: 'GWAS Catalog SBP alleles: rs72683923 and rs11112548 agree; rs189267552 and rs138877676 (Evangelou 2018
