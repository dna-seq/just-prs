summary: '179 breast cancer scores from 45 papers. 177 are ordinary risk scores (overall, ER+, ER-, triple-negative,
  intrinsic-like subtypes, one family-history proxy): higher score = higher risk of that breast cancer.
  173 were annotated catalog-only (per-allele weights plus OR/HR CI > 1 or 1000G r >= 0.2 with such a
  score); PGP000478 and PGP000620 were read. Two scores are not risk scores and sit in a separate concept,
  breast cancer aggressiveness: PGS004611 (case-only ROR-P tumour recurrence score; higher = more aggressive,
  shorter survival) and PGS004890 (case-case; higher = more likely TNBC than luminal). No same-concept
  negative correlations; no inverted deposits found.'
