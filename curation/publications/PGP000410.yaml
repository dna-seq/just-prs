    score_effect: null
    unannotated_reason: 'Deposited weights look sign-inverted. The paper reports a positive beta (0.121, SE 0.016)
      on drinks per week in Add Health, but the catalog file points the other way from every other drinks-per-week
      score: 1000G EUR r = -0.87 with PGS002834/PGS002839/PGS000203/PGS002752, and 0% sign agreement over the top
