scores:
  PGS000217:
    cluster: circulating_proteins.adm
    phenotype: adm_level
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: circulating ADM level (Olink NPX, rank-inverse normalised)
      coding: null
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: full_text
      locator: Methods > Polygenic risk score calculation
      quote: Polygenic risk scores were derived using LDpred algorithm 45 , which adjusts the effect of each SNP
        allele for those of other SNP alleles in linkage disequilibrium (LD) with it
      confidence: medium
    - source: full_text
      locator: Abstract/Introduction
      quote: protein-centric polygenic risk scores (PRS) can predict a substantial fraction of inter-individual
        variability in circulating protein levels
      confidence: medium
    lead_variant_check:
      status: not_run
      note: not run; direction follows the LDpred construction on protein-level GWAS
    review_reason: null
    corrections: []
    status: agent_proposed
    notes: LDpred score trained on SCALLOP GWAS of this protein; higher score = higher predicted protein level (variance-explained
      evaluation in MDC, no directional metric). Different proteins are separate concepts, so anti-correlation with
      other proteins' scores is expected.
