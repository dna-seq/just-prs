summary: >-
  All 114 Liu 2023 (PGP000464) hippocampal subfield scores are in scope under neuroimaging.subcortical_volume,
  one phenotype per subfield (CA1, CA3, CA4, dentate gyrus, HATA, fimbria, fissure, tail, molecular layer,
  subiculum, presubiculum, parasubiculum), all sign +1: a higher score means a larger subfield volume.
  Annotated catalog-only (PGS Catalog beta convention, PRSice C+T). 74 trans-ancestry/UKBB EUR scores are
  medium confidence, corroborated by 1000G EUR r >= 0.2 with a same-subfield score; 38 CHIMGEN EAS scores and
  2 tiny EUR scores (PGS003613, PGS003686) are low confidence with a review_reason. The hippocampal fissure is a
  CSF space, so its higher score means a larger fissure, not more tissue. No aligned-correlation conflicts.
