pgp_id: PGP000456
scores:
  PGS003465:
    score_effect: null
    unannotated_reason: Paper does not state the orientation (Supplementary Note 2 not read). Lead variants against
      the source GWAS (rs17280293 G negative, rs1799807 C positive vs Shrine 2019) and 1000G EUR r=-0.76 with PGS002326
      indicate the weights point to LOWER FEV1/FVC, opposite to the catalog convention; needs the supplement before
      annotating.
  PGS003474:
    cluster: lipids.ldl_cholesterol
    phenotype: ldl_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: LDL cholesterol level
    polarity: 1
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: LDL levels
      confidence: medium
    lead_variant_check:
      status: not_run
      note: none of 13 reference LDL lead SNPs present in the scoring file
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.78 with already-annotated PGS000888. Catalog beta is for
      a sleep-apnea respiratory event index, not LDL; not used.
  PGS003482:
    cluster: lipids.triglycerides
    phenotype: triglycerides
    score_effect: null
    unannotated_reason: 'No corroboration for the catalog direction: 1000G EUR r between -0.07 and +0.05 with every
      other TG score, reference TG lead SNPs split 1 agree / 1 disagree (rs12678919), and the only catalog metric
      is a beta for the sleep-apnoea respiratory event index. The paper (full text read from cache) only says all
      PRSs were associated with their phenotypes (Supplementary Figure 3), without a sign.'
    status: agent_proposed
    notes: PGS Catalog name LDPred2_TG; weights have sd ~5e-5 across ~842K variants.
  PGS003481:
    cluster: lipids.total_cholesterol
    phenotype: total_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: total cholesterol level
    polarity: 1
    evaluation_outcome: null
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Total cholesterol
      confidence: medium
    lead_variant_check:
      status: not_run
      note: none of 10 reference TC/LDL lead SNPs (APOE, PCSK9, LDLR, SORT1, APOB, ABCG8, HMGCR) matched by rsID
        in the scoring file
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.66 with already-annotated PGS001895. Catalog beta is for
      a sleep-apnoea respiratory event index, not TC; not used.
  PGS003462:
    cluster: anthropometry.adiposity
    phenotype: body_mass_index
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: body mass index
    polarity: 1
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Body mass index (BMI)
      confidence: medium
    lead_variant_check:
      status: not_run
      note: null
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.82 with catalog-annotated PGS000910 (same concept, same
      phenotype sign); 1000G EUR correlation with anchor PGS000320 r=+0.59. Catalog beta -0.002 is for respiratory
      event index (sleep apnea), another concept; not directional evidence here.
paper:
