summary: 'All 14 Lp(a) scores sit in the new concept lipids.lipoprotein_a (axis higher Lp(a), undesirable). 13 scores
  increase Lp(a): PGS000667, PGS002297, PGS000752''s paper and PGS005320 were read, PGS001963/PGS002181/PGS003542
  use the authors'' own log Lp(a) GWAS, and PGS000313, PGS000689 and PGS004201-5 are catalog-only, backed by 1000G
  r +0.81 to +0.90 with the anchor and agreeing rs10455872/rs3798220 alleles. PGS000752 (Dron 2021) is recorded
  as distributed: the paper says higher = higher Lp(a), but most LPA-region weights are opposite and it anti-correlates
  (r -0.59 to -0.81) with every other score, so it carries a deposit_inverted correction and sits in the review
  queue. After alignment no conflicts remain.'
