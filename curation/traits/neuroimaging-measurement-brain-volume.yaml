  All 355 UK Biobank brain MRI scores are annotated: 337 snpnet scores from Tanigawa 2022 (PGP000244) and 18 hippocampal-volume scores (PGP000464).
  They sit in 12 neuroimaging concepts (DTI FA/MD/MO, NODDI ICVF/OD/ISOVF, grey matter, subcortical, global and ventricular volume, WMH, T2* iron).
  For every score a higher percentile means a higher value of that MRI measurement, because each score predicts the measurement directly.
  The one exception is the head-size scaling factor (PGS001642): a higher value means a smaller head, so it is sign -1 for brain volume. It is sent to review because that sign comes from the UK Biobank field definition and a 1000G correlation (r = -0.70 with total brain volume), not from a quote.
  The only negative pair (PGS001763 vs PGS001765, r = -0.22) compares two different tracts and is not a sign flip.
