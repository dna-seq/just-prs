[project]
name = "just-prs-workspace"
version = "0.0.0"
description = "Workspace root for just-prs, prs-ui, and prs-pipeline"
requires-python = ">=3.13"
dependencies = [
    "just-prs[reference,liftover]",
    "prs-ui",
    "prs-pipeline",
]

[project.scripts]
prs = "just_prs.cli:run"
just-prs = "just_prs.cli:run"
ui = "prs_ui.cli:launch_ui"
start = "prs_ui.cli:launch_ui"
preselect = "prs_ui.cli:launch_preselect_ui"
pipeline = "prs_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["just_prs_workspace"]

[tool.uv]
managed = true
override-dependencies = [
    # Latest dagster (1.13.20) still requires protobuf<7 and
    # grpcio-health-checking<1.82. 1.81.1 is the newest grpcio pair whose
    # health_pb2 is generated against protobuf 6.x (requires protobuf>=6.33.5,<7).
    # 1.82+ widens that to protobuf<8 / >=7.35 and dagster then fails to import.
    "grpcio==1.81.1",
    "grpcio-health-checking==1.81.1",
]

[tool.uv.workspace]
members = ["just-prs", "prs-ui", "prs-pipeline"]

[tool.uv.sources]
just-prs = { workspace = true }
prs-ui = { workspace = true }
prs-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "plink2: tests that require the PLINK2 binary (auto-downloaded if not in PATH)",
]
