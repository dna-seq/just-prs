    - source: full_text
      locator: Methods > Transferability of polygenic scores (PGS) across ancestries
      quote: with the effect size estimates based on the European training dataset being revised based on an LD
        reference panel matching the test dataset
      confidence: medium
    - source: full_text
      locator: Methods > Phenotypes
      quote: Analyses included data for FG and 2hGlu measured in mmol/l
      confidence: high
    lead_variant_check:
      status: not_run
      note: Top weights rs1387153 T (MTNR1B) and rs1402837 T (G6PC2) positive; MTNR1B rs1387153 T is the known FG-raising
        allele (not checked against GWAS Catalog here).
    review_reason: null
    status: agent_proposed
    notes: European-derived PRS-CSauto score from the MAGIC trans-ancestry paper (training = European meta-analysis
      minus five test cohorts). The paper reports only unsigned R2 and never states in words that higher = higher
      FG; direction follows from PRS-CS posterior effect sizes on FG (PGS Catalog convention). Corroborated by 1000G
      EUR r = +0.48 with PGS000305 (read) and +0.44 with PGS002950.
