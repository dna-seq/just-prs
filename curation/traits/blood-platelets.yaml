summary: '60 platelet scores sorted into three blood concepts. Platelet count (24 scores, reused) now
  also holds plateletcrit (8), which correlates +0.4 to +0.75 with count scores. Mean platelet volume
  (16) and platelet distribution width (8) form a new platelet_size concept, because genetically they
  run opposite to count (r about -0.4 to -0.6). This matches the known biology and is not a sign flip.
  Four Xiang 2025 variance scores (vPGS) form platelet_variability: a higher score means a more variable
  value, not a higher one. Direction for level scores comes from the paper methods (PGP000051, 078, 244,
  457) or catalog-only with r >= +0.5 to the read anchor. No aligned-correlation conflicts.'
