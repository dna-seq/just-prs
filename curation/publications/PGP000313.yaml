    - source: catalog
      locator: scores.trait_reported
      quote: Total cholesterol
      confidence: medium
    lead_variant_check:
      status: agree
      note: '2 of 2 reference lead SNPs carry the cholesterol-raising sign: rs12740374 T -0.127; rs429358 C +0.123'
