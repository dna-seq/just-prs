summary: |
  All 33 rheumatoid arthritis scores are RA-risk scores in one concept (immune.rheumatoid_arthritis); higher score = higher genetic risk of RA.
  30 were annotated from the catalog (per-allele weights, OR/HR against RA or 1000G correlation with the anchor PGS004873); PGP000081 (G-PROB) and PGP000286 were read.
  PGS000194 is the G-PROB CCP-positive RA score despite a catalog reported trait of "CCP-negative"; PGS000195 is the CCP-negative score.
  PGS002260 is an RA-susceptibility PRS evaluated on radiographic progression in Japanese RA patients, which explains its near-zero EUR correlation.
  No negative correlations within the concept.
