      other DPW scores). The paper does not state the effect-allele convention, so the orientation cannot be confirmed.
      Needs human review; taken as is, a high percentile would probably mean fewer drinks.'
    notes: LDpred on GSCAN 2022 EUR drinks per week. Suspected effect-allele swap in the deposited file; report
      to PGS Catalog.
