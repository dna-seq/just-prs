summary: 'All 219 scores are type 2 diabetes risk scores in one concept (endocrine.type_2_diabetes); 213
  are annotated, 211 of them catalog-only. Higher score = higher T2D risk for every annotated score except
  PGS002277, a HOMA-B-weighted beta-cell-function score where higher = better beta cell function = lower
  T2D risk. PGS004887 (PGP000619) looks like an inverted deposit: the paper says higher = more incident
  T2D, but its lead variants and 1000G correlations (r down to -0.97) point the other way; flagged for
  review. PGS005147 (PGP000704, PRS-CS EAS) has the same inverted pattern and no direction statement,
  so it is left unannotated. PGS000857 (obesity partition, paywalled paper) and four null-OR scores from
  PGP000393 are unannotated.'
