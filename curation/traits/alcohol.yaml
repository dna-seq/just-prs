summary: '47 alcohol scores split into two concepts: drinking level (frequency, amount, current-drinker status, drinking more
  than before) and alcohol use disorder / problematic use. 40 are annotated. The two Privé scores on UK Biobank field 1558
  (PGS001934, PGS002152) use the raw coding (1 daily ... 6 never), so a high score means LESS frequent drinking; the GBE version
  (PGS001087) runs the other way. PGS003376 (GSCAN 2022 EUR drinks per week) has deposited weights inverted against every
  other drinks-per-week score (r = -0.87), although the paper reports a positive beta, so it is left unannotated and needs
  a human decision. The same holds for its AFR/AMR/EAS siblings, whose orientation cannot be checked. Two ExPRSweb DBSLMM
  scores and the GBE ''Alcohol consumed'' score are unannotated for lack of corroboration. Liver cirrhosis and water intake
  are out of scope.'
