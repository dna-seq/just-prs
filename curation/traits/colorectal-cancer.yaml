summary: '75 in-scope scores in one concept (colorectal cancer, higher = more risk): 63 all-site CRC, 7 colon, 2
  rectal, 3 adenoma/benign neoplasia (D12, advanced neoplasm). 70 were annotated from the catalog (OR/HR above 1
  or r>=+0.2 with an annotated score); 4 papers were read. PGS000802 (Chinese CRC_19) has 10 of 13 lead alleles
  opposite the CRC risk allele and anti-correlates with 7 CRC scores; recorded with the paper direction plus a partial_allele_inconsistency/quarantine
  correction, in review. PGS000151 stays unannotated (abstract only, no direction statement, mixed alleles). PGS004586
  is a CRC survival score and is out of scope.'
