summary: 'Composite CVD scores (Weissbrod UKB series, Jung CVD, Sun CVD metaPRS, Cheng T2D-CVD wGRS, Elliott CVD)
  go to a new concept cardiovascular.cardiovascular_disease; aortic stenosis scores to a new cardiovascular.aortic_stenosis;
  "High BP" (Tanigawa) to blood_pressure.hypertension; the 81 already-curated CAD scores are reused. Three deposits
  look allele-inverted and are recorded as distributed for review: PGS000117 (Elliott CVD, like its CAD sibling
  PGS000116), PGS004888 (Mandla CAD, protective APOE/PCSK9/LDLR alleles up, r=-0.78 vs anchor) and PGS005252 (IAVGC
  aortic stenosis, PCSK9/LDLR opposite, r=-0.65 vs PGS005254, which matches canonical loci). PGS000863 (Aly, 330-SNP
  CVD GRS) stays unannotated: no open text, r~0 with every CAD score and mixed lead variants. PGS002361 (BBJ-trained)
  is annotated low-confidence for review.'
