summary: 'Four adult body-weight scores, placed as a body_weight phenotype (sign +1) in anthropometry.adiposity
  because weight tracks the same heavier-body axis as BMI (r = +0.64 to +0.87 with each other). PGS001230, PGS003898
  (Tanigawa snpnet, UKB 21002) and PGS004410 (Jung LDpred2, UKB 21002) mean higher = heavier. PGS004373 (Jung, UKB
  23098 bioimpedance weight) is an inverted deposit: r = -0.996 with PGS004410 and FTO/GNAT2 BMI-raising alleles
  carry negative weights, so as distributed a high percentile means lighter; recorded as distributed with corrections,
  awaiting human review. Birth weight/size, weight change and the composite body-size factor are out of scope.'
