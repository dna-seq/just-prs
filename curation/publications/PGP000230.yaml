  pmid: '34887591'
  doi: https://doi.org/10.1038/s41586-021-04064-3
  title: The power of genetic diversity in genome-wide association studies of lipids.
template:
  rule: Biobank-style batch of LDL-family scores; each score predicts the reported lipid measurement itself, with
    PGS Catalog weights as per-allele effects on that measurement (higher score = higher level). Scores flagged
    individually override this.
  provenance:
  - source: catalog
    locator: scores.trait_reported
    quote: LDL cholesterol
    confidence: medium
