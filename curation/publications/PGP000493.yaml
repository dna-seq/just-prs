pgp_id: PGP000493
scores:
  PGS003855:
    cluster: lipids.ldl_cholesterol
    phenotype: ldl_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: LDL cholesterol level
    polarity: 1
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: LDL cholesterol
      confidence: medium
    lead_variant_check:
      status: agree
      note: 'reference LDL lead SNPs (APOE, PCSK9, LDLR, APOB, SORT1, ABCG5/8): 2 agree, 0 disagree'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.56 with already-annotated PGS003791. Evaluated on the estimated
      annual change of LDL, not level.
  PGS003854:
    cluster: lipids.triglycerides
    phenotype: triglycerides
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: triglyceride level
    polarity: 1
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Triglycerides
      confidence: medium
    lead_variant_check:
      status: agree
      note: 'reference TG lead SNPs (APOA5, GCKR, LPL, TRIB1, TM6SF2): 2 agree, 0 disagree'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.74 with already-annotated PGS004657. Catalog evaluation
      is on the estimated annual change of triglycerides.
  PGS003853:
    cluster: lipids.total_cholesterol
    phenotype: total_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: total cholesterol level
    polarity: 1
    evaluation_outcome: null
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Total cholesterol
      confidence: medium
    lead_variant_check:
      status: agree
      note: '2 of 2 reference lead SNPs carry the cholesterol-raising sign: rs12740374 T -0.0806; rs1367117 A +0.0528'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.57 with already-annotated PGS003825. Evaluated on the estimated
      annual change of total cholesterol, not level.
paper:
  pmid: '36988954'
  doi: 10.1001/jamanetworkopen.2023.5565
  title: Age and Genetic Risk Score and Rates of Blood Lipid Changes in China.
