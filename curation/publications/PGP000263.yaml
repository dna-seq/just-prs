      quote: Ease of skin tanning
      confidence: medium
    lead_variant_check:
      status: agree
      note: MC1R rs1805007-T (burn-prone) carries a positive weight (+0.46)
    status: agent_proposed
    notes: Penalized regression. The phenotype is raw field 1727 (higher = less tanning), so the score measures
      poor tanning; direction taken from the phenotype definition plus the score name "less_tanned". 1000G EUR r=+0.76
      with "never tan, only burn" (PGS001247). Code (prepare-pheno-fields.R lines 179-183, saved in the lookup dir)
      reads field 1727-0.0, sets y < 0 to NA and saves it unchanged as less_tanned.rds; not quoted as provenance
      because the quote checker strips "<...>" spans from R code.
