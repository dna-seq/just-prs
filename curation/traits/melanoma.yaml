summary: 'All 51 melanoma scores sit in one concept, cancer.melanoma: a higher score means higher melanoma risk. Every
  one was annotated from the catalog (plain "Melanoma" trait, OR/HR above 1 or positive 1000G correlation with the anchor);
  no paper needed reading. No negative correlations inside the concept. PGS000118 (MEL29) lists the MC1R rs1805007 non-risk
  allele as effect allele, recorded as partial_allele_inconsistency and sent to review. 28 generic skin-cancer and non-melanoma
  skin-cancer scores are out of scope and need their own concept.'
