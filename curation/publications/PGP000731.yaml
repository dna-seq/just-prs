      recorded: '2026-10-26'
      by: agent
      upstream_report: null
    - kind: metric_not_from_file
      action: discount_metrics
      effect: The catalog beta (0.01 on AUDIT-P) describes the authors' own score, not this inverted file.
      evidence: Deposited file is the negation of the authors' score (see deposit_inverted).
      recorded: '2026-10-26'
      by: agent
      upstream_report: null
    status: agent_proposed
