summary: '71 white-cell scores from 10 papers sorted into three new blood concepts: blood.white_cell_count (22 scores), blood.neutrophil_count
  (count 12 + percentage 8) and blood.monocyte_count (count 21 + percentage 8); for every score a higher value means more
  of that cell type. Seeds are the read Xu 2022 elastic-net (PGP000051) and Vuckovic 2020 (PGP000078) scores; the rest are
  catalog-only with 1000G EUR r >= +0.2 to a same-phenotype seed (most +0.5 to +0.87; the two Biobank Japan-trained Weissbrod
  scores PGS002372 and PGS002380 sit at +0.21). No negative correlations inside a phenotype; monocyte and neutrophil percentages
  anti-correlate with each other as expected for shares of one total. Five vQTL variance scores (PGP000723) and the INFLA
  composite are out of scope. No lookups used.'
