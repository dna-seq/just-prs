summary: 52 thyroid scores in scope, all annotated as higher score = more of the reported condition or level. Hypothyroidism (25 scores, plus Hashimoto thyroiditis, thyroid medication use and self-reported thyroid condition) forms one coherent block (1000G r 0.2-0.86 with OR-confirmed anchors). Hyperthyroidism/thyrotoxicosis and Graves' disease, goitre (non-toxic and benign nodular) get their own concepts; they correlate only weakly with hypothyroidism. TSH and free T4 (Mulder 2023, children) sit on one thyroid-function axis with TSH sign -1; their scores are nearly uncorrelated (r=+0.07). Goitre scores anti-correlate with the TSH score (r -0.3 to -0.4), consistent with low-TSH alleles raising goitre risk, not a sign flip. Most entries are catalog-only (medium confidence); the self-reported thyroid-condition definition (Weissbrod) was not found in sources.
