summary: 'All 63 uncurated kidney-group scores are decided: 62 annotated and 1 left unannotated (PGS003042,
  degenerate DBSLMM PUFA file). Urate scores join endocrine.gout/serum_urate; urea joins kidney_function
  as blood_urea with sign -1 (higher urea = lower filtration), next to eGFR (+1), serum creatinine and
  cystatin C (-1). New kidney concepts: albuminuria, urine_creatinine (neutral), kidney_stones, acute_kidney_injury
  and cystatin_c_production (Kleeman 2023, read by one lookup). Kidney cancer is cancer.kidney_cancer;
  the PUFA scores (lipids.polyunsaturated_fatty_acids, other_pufa) go to review because the catalog BETA
  against total PUFA is negative; Addison disease is endocrine.adrenal_insufficiency. Most annotations
  are catalog-only or reuse paper-wide Methods quotes, backed by OR/HR/BETA CIs or 1000G r with already-annotated
  scores.'
