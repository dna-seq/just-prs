            sign: 1
      self_harm:
        label: Self-harm and suicidal thoughts
        axis: more thoughts of self-harm or suicide
        valence: undesirable
        valence_basis: Thoughts of self-harm or suicide signal serious distress and risk.
        status: agent_proposed
        aliases:
        - suicidal thoughts
        - suicidal ideation
        - self-harm
        - self injury
        phenotypes:
          self_harm_thoughts:
            label: Ever contemplated self-harm or recent thoughts of suicide or self-harm (UKB 20485 /
              20513)
            sign: 1
  hepatic:
    label: Liver
    concepts:
      liver_enzymes:
        label: Liver enzyme levels
        axis: higher measured liver enzyme level
        valence: neutral
        valence_basis: Within the normal range the blood level of a liver enzyme is not good or bad on
          its own; only marked elevation signals liver injury.
        status: agent_proposed
        aliases:
        - liver function test
        - LFT
        - liver enzymes
        - transaminases
        - elevated liver enzymes
        phenotypes:
          alt_level:
            label: Serum alanine aminotransferase (ALT) level
            sign: 1
            aliases:
            - ALT
            - SGPT
          ast_level:
            label: Serum aspartate aminotransferase (AST) level
            sign: 1
            aliases:
            - AST
            - SGOT
          ggt_level:
            label: Serum gamma-glutamyl transferase (GGT) level
            sign: 1
            aliases:
            - GGT
            - gamma GT
          alp_level:
            label: Serum alkaline phosphatase (ALP) level
            sign: 1
            aliases:
            - ALP
            - alk phos
      ast_alt_ratio:
        label: AST to ALT ratio
        axis: relatively more AST than ALT in blood
        valence: neutral
        valence_basis: The ratio is a diagnostic pattern (high in alcoholic or advanced liver disease,
          low in fatty liver), not good or bad on its own.
        status: agent_proposed
        aliases:
        - De Ritis ratio
        - AST/ALT
        - liver enzyme ratio
        phenotypes:
          ast_alt_ratio:
            label: AST to ALT ratio (log AST minus log ALT; higher = relatively more AST)
            sign: 1
      serum_albumin:
        label: Serum albumin
        axis: higher serum albumin level
        valence: neutral
        valence_basis: Albumin within the normal range carries no clear benefit or harm; only low albumin
          in liver or kidney disease is a warning sign.
        status: agent_proposed
        aliases:
        - albumin
        - blood albumin
        - liver protein synthesis
        phenotypes:
          serum_albumin:
            label: Serum albumin level
            sign: 1
      bilirubin:
        label: Bilirubin
        axis: higher blood bilirubin
        valence: neutral
        valence_basis: Mildly high bilirubin is mostly Gilbert syndrome, which is harmless; only very
          high levels mean jaundice from disease.
        status: agent_proposed
        aliases:
        - jaundice
        - Gilbert syndrome
        - yellow skin
        - UGT1A1
        phenotypes:
          total_bilirubin:
            label: Total serum bilirubin
            sign: 1
          direct_bilirubin:
            label: Direct (conjugated) serum bilirubin
            sign: 1
          bilirubin_metabolism_disorder:
            label: Disorder of bilirubin excretion or metabolism (mostly Gilbert syndrome)
            sign: 1
      fatty_liver:
        label: Fatty liver disease
        axis: more liver fat and higher risk of fatty liver disease
        valence: undesirable
        valence_basis: Liver fat accumulation (MASLD/NAFLD) can progress to inflammation, fibrosis and
          cirrhosis.
        status: agent_proposed
        aliases:
        - fatty liver
        - NAFLD
        - MASLD
        - hepatic steatosis
        - healthy liver
        phenotypes:
          masld:
            label: Metabolic dysfunction-associated (non-alcoholic) fatty liver disease
            sign: 1
          masld_severity:
            label: NAFLD activity score (histological severity)
            sign: 1
          liver_fat:
            label: Hepatic fat content (MRI or biopsy)
            sign: 1
          chronic_alt_elevation:
            label: Unexplained chronic ALT elevation (NAFLD proxy)
            sign: 1
          chronic_liver_disease:
            label: Other chronic non-alcoholic liver disease (phecode / ICD-10 K76, mostly fatty liver)
            sign: 1
      cirrhosis:
        label: Liver cirrhosis
        axis: higher risk of liver cirrhosis
        valence: undesirable
        valence_basis: Cirrhosis is end-stage scarring of the liver.
        status: agent_proposed
        aliases:
        - cirrhosis
        - liver scarring
        - liver fibrosis
        - alcoholic liver disease
        phenotypes:
          cirrhosis:
            label: Liver cirrhosis (all causes)
            sign: 1
          alcoholic_cirrhosis:
            label: Alcohol-related cirrhosis
            sign: 1
  eye:
    label: Eye
    concepts:
      glaucoma:
        label: Glaucoma
        axis: higher glaucoma risk
        valence: undesirable
        valence_basis: Glaucoma damages the optic nerve and causes irreversible vision loss.
        status: agent_proposed
        aliases:
        - glaucoma risk
        - POAG
        - open-angle glaucoma
        - optic nerve damage
        phenotypes:
          glaucoma:
            label: Glaucoma (any type)
            sign: 1
          primary_open_angle_glaucoma:
            label: Primary open-angle glaucoma
            sign: 1
      intraocular_pressure:
        label: Intraocular pressure
        axis: higher eye pressure
        valence: undesirable
        valence_basis: Raised intraocular pressure is the main modifiable risk factor for glaucoma.
        status: agent_proposed
        aliases:
        - eye pressure
        - IOP
        - ocular hypertension
        - high eye pressure
        phenotypes:
          intraocular_pressure:
            label: Intraocular pressure (mmHg)
            sign: 1
          iop_goldmann_correlated:
            label: Goldmann-correlated intraocular pressure (IOPg, mmHg)
            sign: 1
          iop_corneal_compensated:
            label: Corneal-compensated intraocular pressure (IOPcc, mmHg)
            sign: 1
      cataract:
        label: Cataract
        axis: higher cataract risk
        valence: undesirable
        valence_basis: Cataract clouds the lens and impairs vision until surgery.
        status: agent_proposed
        aliases:
        - cloudy lens
        - lens opacity
        - cataracts
        phenotypes:
          cataract:
            label: Cataract
            sign: 1
      macular_degeneration:
        label: Age-related macular degeneration
        axis: higher macular degeneration risk
        valence: undesirable
        valence_basis: Macular degeneration destroys central vision in older age.
        status: agent_proposed
        aliases:
        - AMD
        - ARMD
        - macular degeneration
        - central vision loss
        phenotypes:
          age_related_macular_degeneration:
            label: Age-related macular degeneration
            sign: 1
      refractive_error:
        label: Short-sightedness and refractive error
        axis: more short-sighted (myopic)
        valence: context_dependent
        valence_basis: Myopia (more negative refraction) and strong hyperopia (more positive refraction)
          both need correction; the axis points toward myopia, which raises the risk of retinal detachment
          and myopic maculopathy.
        status: agent_proposed
        aliases:
        - short-sighted
        - near-sighted
        - nearsightedness
        - long-sighted
        - far-sighted
        phenotypes:
          myopia:
            label: Myopia (short-sightedness) diagnosis
            sign: 1
          spherical_power:
            label: Spherical power in dioptres (positive = hyperopic, negative = myopic)
            sign: -1
          spherical_equivalent:
            label: Spherical equivalent refractive error in dioptres (positive = hyperopic)
            sign: -1
          age_started_glasses:
            label: Age started wearing glasses or contact lenses (later start = less myopic)
            sign: -1
      glasses_use:
        label: Wearing glasses or contact lenses
        axis: wears glasses or contact lenses
        valence: neutral
        valence_basis: Wearing glasses reflects myopia, hyperopia or age-related presbyopia; it is a correction,
          not a disease.
        status: agent_proposed
        aliases:
        - wears glasses
        - spectacles
        - contact lenses
        phenotypes:
          wears_glasses:
            label: Wears glasses or contact lenses
            sign: 1
      corneal_curvature:
        label: Corneal curvature (keratometry)
        axis: steeper cornea (higher corneal power)
        valence: neutral
        valence_basis: Corneal power varies normally between people; only extreme steepening (keratoconus)
          is a disease.
        status: agent_proposed
        aliases:
        - keratometry
        - corneal power
        - corneal steepness
        - K reading
        phenotypes:
          keratometry_strong_meridian:
            label: Keratometry strong meridian power (dioptres)
            sign: 1
          keratometry_weak_meridian:
            label: Keratometry weak meridian power (dioptres)
            sign: 1
      astigmatism:
        label: Corneal astigmatism
        axis: more corneal astigmatism
        valence: undesirable
        valence_basis: Astigmatism blurs vision at all distances and needs correction.
        status: agent_proposed
        aliases:
        - astigmatism
        - cylinder
        - irregular cornea
        phenotypes:
          cylindrical_power:
            label: Keratometric cylindrical power in minus-cylinder dioptres (more negative = more astigmatism)
            sign: -1
      corneal_biomechanics:
        label: Corneal biomechanics
        axis: higher corneal hysteresis and resistance
        valence: context_dependent
        valence_basis: Low corneal hysteresis and resistance accompany glaucoma and keratoconus, but these
          are measurements, not diseases.
        status: agent_proposed
        aliases:
        - corneal hysteresis
        - corneal stiffness
        - corneal resistance factor
        - ocular response analyzer
        phenotypes:
          corneal_hysteresis:
            label: Corneal hysteresis (mmHg)
            sign: 1
          corneal_resistance_factor:
            label: Corneal resistance factor (mmHg)
            sign: 1
      corneal_disease:
        label: Corneal dystrophy and other corneal disorders
        axis: higher corneal disease risk
        valence: undesirable
        valence_basis: Corneal dystrophies such as Fuchs dystrophy cloud the cornea and can need transplantation.
        status: agent_proposed
        aliases:
        - Fuchs dystrophy
        - corneal dystrophy
        - cornea disease
        phenotypes:
          corneal_dystrophy:
            label: Corneal dystrophy
            sign: 1
          other_corneal_disorders:
            label: Other disorders of cornea (ICD-10 H18)
            sign: 1
      retinal_detachment:
        label: Retinal detachment
        axis: higher retinal detachment risk
        valence: undesirable
        valence_basis: Retinal detachment is an emergency that can cause permanent vision loss.
        status: agent_proposed
        aliases:
        - detached retina
        - retinal tear
        - retinal break
        phenotypes:
          retinal_detachment:
            label: Retinal detachment, breaks or defects
            sign: 1
      retinal_disorders:
        label: Other retinal disorders
        axis: higher retinal disorder risk
        valence: undesirable
        valence_basis: Retinal disorders threaten vision.
        status: agent_proposed
        aliases:
        - retinopathy
        - retina disease
        phenotypes:
          other_retinal_disorders:
            label: Other retinal disorders (ICD-10 H35)
            sign: 1
          retinal_disorders_in_other_diseases:
            label: Retinal disorders in diseases classified elsewhere (ICD-10 H36, mostly diabetic retinopathy)
            sign: 1
      diabetic_eye_disease:
        label: Diabetic eye disease
        axis: higher diabetic eye disease risk
        valence: undesirable
        valence_basis: Diabetic retinopathy is a leading cause of blindness in working-age adults.
        status: agent_proposed
        aliases:
        - diabetic retinopathy
        - diabetes eye damage
        phenotypes:
          diabetic_eye_disease:
            label: Diabetic eye disease (self-reported)
            sign: 1
      eye_inflammation:
        label: Eye inflammation (iritis, uveitis)
        axis: higher eye inflammation risk
        valence: undesirable
        valence_basis: Iritis and uveitis are painful, recurrent and can damage vision.
        status: agent_proposed
        aliases:
        - uveitis
        - iritis
        - anterior uveitis
        - red painful eye
        phenotypes:
          iritis:
            label: Iritis
            sign: 1
          iridocyclitis:
            label: Iridocyclitis (anterior uveitis)
            sign: 1
          eye_inflammation:
            label: Inflammation of the eye (phecode)
            sign: 1
