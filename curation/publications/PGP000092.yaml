  PGS000305:
    cluster: endocrine.glycemia
    phenotype: fasting_glucose
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: fasting glucose level (mmol/l) in adolescents without diabetes
      coding: null
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: full_text
      locator: Results > GRS Analysis
      quote: For all traits except ALT, significant increases of trait levels were found in individuals at the top
        wGRS decile compared with those at the bottom decile
      confidence: high
    - source: supplement
      locator: s001 Supplementary Methods, statistical analyses
      quote: weighted by the corresponding effect sizes from the literature.
      confidence: medium
    - source: supplement
      locator: s002 Table 3 footnote
      quote: FG (mmol/l), FGadjBMI (mmol/l)
      confidence: high
    lead_variant_check:
      status: agree
      note: 'Paper SNP table: rs560887 C, rs10830963 G, rs4607517 A all direction 1 with positive beta (MAGIC, PMID
        20081858); these are the known FG-raising alleles. GWAS Catalog not queried.'
    review_reason: null
    status: agent_proposed
    notes: '31-SNP weighted GRS (MAGIC 2010 FG loci, betas corrected for sample overlap) in the TRAILS youth cohort.
      Weights are positive literature betas of the risk allele; higher GRS = higher fasting glucose. Corroborated
      by 1000G EUR r = +0.48 with PGS001350 and +0.72 with PGS002950. Result: 0.25 (0.15, 0.36) mmol/l higher FG
      in the top vs bottom wGRS decile, R2 3.67% (s002 Table 3).'
