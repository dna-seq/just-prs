    cluster: pigmentation.skin_tanning
    phenotype: tanning_ability
    measurement_kind: ordinal
    score_effect:
      direction: decreases
      target: ease of skin tanning (score named "less tanned")
      coding: UKB 1727 raw value (1 very tanned, 2 moderately, 3 mildly/occasionally, 4 never tan only burn; negatives
        set to NA); higher = tans less
    polarity: -1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: catalog
      locator: scores.name
      quote: portability-PLR_less_tanned
