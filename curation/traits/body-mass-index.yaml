summary: 'All 140 in-scope scores sit in one concept, anthropometry.adiposity (axis: higher BMI). BMI, obesity and
  childhood body size scores point the same way: a higher score means a higher BMI or more obesity risk. The 8 annotated
  thinness scores (ExPRSweb, PGP000393) point the other way; they go to review because the paper does not define
  the thinness cases and their 1000G correlation with BMI scores is mixed. PGS003127, PGS003132 and PGS003846 remain
  unannotated. PGS004864 turned out to be a weight-loss-after-bariatric-surgery response score and is out of scope,
  as are 15 BMI-adjusted fat-distribution, glycaemic, sleep-apnea and T2D-partition scores.'
