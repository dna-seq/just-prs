summary: 'All 22 MONDO_0002009 scores are case/control major depressive disorder (lifetime CIDI, ICD-10, incident or GWAS-based)
  and sit in one phenotype, psychiatric.depression / major_depressive_disorder: higher score = higher MDD risk. 20 are catalog-only,
  corroborated by HR 1.24 (PGS004885), OR 1.26 (PGS002759) and a positively correlated 1000G block (no negative pairs). Two
  few-SNP scores (PGS003442, 8 SNPs; PGS004591, 17 SNPs) were read and lead variants agree. Minimal-phenotyping, symptom,
  recurrent and Privé depressive-disorder scores belong to other ontology groups and are out of scope here.'
