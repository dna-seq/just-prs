summary: >-
  All 7 scores (Tanigawa/GBE, Privé, Ding; all UK Biobank) measure self-rated health and sit in one
  concept, wellbeing.self_rated_health. The Privé and Ding scores use raw UKB codings (2178 1 excellent ... 4 poor;
  20459 1 extremely happy ... 6 extremely unhappy), so higher = poorer health or less happy with health. GBE's PGS001008
  (QT_FC1002178) is reversed: higher = better health; its negative 1000G correlations with the rest are this coding,
  not an inverted file. PGS001401 (QT_FC1004548) keeps the raw order. The two GBE orientations rest on GWAS signs at FTO
  and correlations, not a stated definition, so they are flagged for review.
