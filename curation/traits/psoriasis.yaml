summary: 'All 31 psoriasis scores sit in one concept, immune.psoriasis (higher risk of psoriasis, undesirable). 27 are psoriasis-risk
  scores and 2 are psoriatic-arthritis risk scores; for all of them a higher score means higher risk. Two Smith 2020 scores
  (PGS000342, PGS000343) are different: they discriminate psoriatic arthritis from skin-only psoriasis among patients, so
  a higher score means joint involvement is more likely, not that psoriasis is more likely (HLA-C*06:02 has a negative weight).
  No negative correlations inside the concept; the sparse P+T scores from Weissbrod 2022 correlate near zero with the HLA-heavy
  anchor but positively with each other and with PolyFun-pred. Only one paper was read; the rest are catalog-only with OR/HR
  or 1000G correlation corroboration.'
