      quote: Fasting plasma glucose
      confidence: medium
    lead_variant_check:
      status: not_run
      note: null
    review_reason: null
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). Common-variant GRS (CVGRS) for fasting plasma glucose from
      the Korean (KoGES/KBN) East Asian GWAS; PGS Catalog weights are per-allele effects on the reported trait.
      Corroborated by 1000G EUR r = +0.34 with PGS000305 and +0.38 with PGS000306 (both read, higher = higher fasting
      glucose), plus catalog beta +0.204 against FPG and OR 1.46 for type 2 diabetes in East Asians (no CI reported).
