summary: 'All 75 systolic blood pressure scores are in one concept, cardiovascular.blood_pressure (higher
  = higher SBP, undesirable). 71 were annotated from the catalog: plain SBP trait names, corroborated
  by an SBP beta whose CI excludes 0 or by 1000G EUR r >= +0.2 with such a score. Three papers were read.
  PGS003970/PGS003971 (Shetty 2023, sex-specific PRS-CS) are meant to raise SBP, but the deposited weights
  look sign-inverted: lead SBP alleles have negative weights and they correlate down to r=-0.77 with every
  other SBP score. As scored from the file, a higher value likely means lower SBP. They go to review.
  PGS005321 (Tuerkmen 2024, 240 Evangelou SNPs) also goes to review, because its lead variants are mixed
  and it barely correlates with other SBP scores. PGS003965 (African component) is resolved from its lead
  variant and the paper.'
