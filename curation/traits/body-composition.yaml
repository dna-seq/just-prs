summary: 82 UK Biobank bioimpedance scores from 6 papers, all in scope and annotated without paper lookups.
  Fat percentage and fat mass (whole body and arm/leg/trunk) join anthropometry.adiposity with sign +1.
  Fat-free mass, impedance-predicted mass and appendicular lean mass form a new concept anthropometry.lean_mass
  (+1); bioelectrical impedance sits in it with sign -1, because higher impedance means less lean tissue
  and water. Every score is higher score = higher measured value; the 36 negative 1000G pairs are all
  impedance vs mass scores and vanish after alignment (0 conflicts). PGS004380-4384 carry a wrong catalog
  ontology label (Abnormality of the skeletal system) but are impedance scores.
