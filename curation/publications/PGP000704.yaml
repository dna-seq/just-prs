      paper_direction: null
      evidence: Catalog BETA 1.19 is the paper's perSD OR for its non-inverted score; the deposited file behaves
        as its negation.
      recorded: '2026-10-26'
      by: agent
      upstream_report: null
    status: agent_proposed
    notes: PRS-CSx (EAS+EUR) cholelithiasis score evaluated in Korean HEXA (1,784 cases). As computed from the PGS
      Catalog file, a higher score means LOWER gallstone risk. Anti-correlation is moderate (-0.33, EUR panel, cross-ancestry
