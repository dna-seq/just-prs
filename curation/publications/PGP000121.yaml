pgp_id: PGP000121
scores:
  PGS000661:
    cluster: lipids.ldl_cholesterol
    phenotype: ldl_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: LDL cholesterol level
    polarity: 1
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: LDL cholesterol
      confidence: medium
    lead_variant_check:
      status: agree
      note: 'reference LDL lead SNPs (APOE, PCSK9, LDLR, APOB, SORT1, ABCG5/8): 2 agree, 0 disagree'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.33 with already-annotated PGS004972.
  PGS000659:
    cluster: lipids.triglycerides
    phenotype: triglycerides
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: triglyceride level
    polarity: 1
    evaluation_outcome:
      phenotype: triglycerides
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Triglycerides
      confidence: medium
    lead_variant_check:
      status: agree
      note: 'reference TG lead SNPs (APOA5, GCKR, LPL, TRIB1, TM6SF2): 2 agree, 0 disagree'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by catalog BETA 0.165 (SE 0.008) against log-transformed baseline triglycerides.
  PGS000658:
    cluster: lipids.total_cholesterol
    phenotype: total_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: total cholesterol level
    polarity: 1
    evaluation_outcome:
      phenotype: total_cholesterol
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Total cholesterol
      confidence: medium
    lead_variant_check:
      status: agree
      note: '1 of 1 reference lead SNPs carry the cholesterol-raising sign: rs429358 C +0.105'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by its own catalog metric, beta 0.042 (SE 0.003) on total cholesterol, CI excluding the
      null.
paper:
  pmid: '33608049'
  doi: 10.1186/s13073-021-00831-z
  title: Development of genome-wide polygenic risk scores for lipid traits and clinical applications for dyslipidemia,
    subclinical atherosclerosis, and diabetes cardiovascular complications among East Asians.
