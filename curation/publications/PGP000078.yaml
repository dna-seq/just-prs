      quote: then inverse normalized for cohort level association analysis or GWAS
      confidence: medium
    lead_variant_check:
      status: not_run
      note: top loci rs607203 (HBS1L-MYB), rs140446749 (SPTA1), rs116734477 share signs with PGP000051 elastic-net
        scores; no directional statement in the paper
    status: agent_proposed
    notes: Genome-wide significant variants weighted by UK Biobank GWAS betas on the trait; paper states effect
      alleles are aligned to give a positive correlation with the phenotype. 1000G EUR r = +0.66 to +0.77 with the
      PGP000051 same-phenotype scores.
