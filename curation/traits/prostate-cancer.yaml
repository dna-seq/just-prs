summary: 'All 95 scores are prostate cancer risk scores; every pair correlates non-negatively in 1000G EUR (min
  r -0.19) and all directional metrics are OR/HR > 1. Higher score = higher risk of prostate cancer for every score.
  90 were annotated catalog-only (OR/HR CI excluding null or r>=0.2 with an annotated score); 5 were read: PHS1/PHS2
  polygenic hazard scores (log-HR, higher = earlier diagnosis), PRState Eur/Trans (African-ancestry target), and
  a Korean clinically significant (Gleason>=7) score placed under aggressive_prostate_cancer. PGS001292 is a UKB
  family-history proxy. No sign flips or inverted deposits found.'
