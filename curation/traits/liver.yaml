summary: '82 liver scores in a new hepatic domain: liver enzymes (ALT, AST, GGT, ALP), AST/ALT ratio, serum albumin,
  bilirubin (incl. Gilbert-type bilirubin disorders), fatty liver (MASLD, activity score, liver fat, chronic ALT elevation,
  other chronic liver disease) and cirrhosis. All are annotated as higher score = higher level or higher risk; PGP000128,
  PGP000594, PGP000645 and PGP000258 were read, the rest catalog-only with CI metrics or 1000G r >= +0.2 to read anchors
  and canonical lead loci (UGT1A1, PNPLA3, TM6SF2, SERPINA1) agreeing. No within-phenotype negative pairs. Open: PGS001777
  (Whitfield 3-SNP) counts the protective HSD17B13 rs6834314 G allele as risk, recorded as partial_allele_inconsistency
  and sent to review; catalog metrics for PGS000704 (HR 1.67) and PGS004621 (OR 1.42) belong to other scores/papers.'
