scores:
  PGS000094:
    cluster: blood.reticulocyte_count
    phenotype: hlsr_count
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: high light scatter reticulocyte count (covariate-adjusted)
      coding: null
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance: &id001
    - source: full_text
      locator: STAR Methods > Elastic net
      quote: These effect sizes are estimated by minimizing the penalized squared loss function
      confidence: medium
    - source: full_text
      locator: Discussion
      quote: we have made the blood cell trait PGSs constructed using EN (on the expanded variant set with p value
        threshold = 1 and trained on UK Biobank) publicly available at the PGS Catalog
      confidence: medium
    - source: full_text
      locator: Results > Comparing estimated SNP effect sizes between univariate analysis and machine learning
      quote: effect sizes of most variants using BR or EN are the same or similar to those from the univariate analysis
        in GWAS
      confidence: medium
    lead_variant_check:
      status: not_run
      note: no rsIDs in the file; top loci chr20:4176425, chr6:139520516 (HBS1L-MYB), chr5:52.79M, chr1:158.67M
        (SPTA1) carry the same signs as the independently derived Vuckovic 2020 scores (PGP000078)
    status: agent_proposed
    notes: Elastic net fitted to the adjusted trait level (UK Biobank), so weights are per-allele effects on the
      level; higher score = higher value. The paper does not restate the direction in words. 1000G EUR r = +0.66
      to +0.91 with all other in-scope reticulocyte scores.
