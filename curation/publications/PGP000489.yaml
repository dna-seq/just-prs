  PGS003788:
    cluster: lipids.ldl_cholesterol
    phenotype: ldl_cholesterol
    score_effect: null
    unannotated_reason: 'Deposited scoring file is broken: every one of the ~1.2-1.7M weights equals a near-constant
      +0.1559 (sd ~1e-4), so the score is dominated by the count of coded alleles, not LDL. Residual per-SNP deviations
      point toward higher LDL, but the total does not measure it (1000G EUR r≈0 with other LDL scores; PGS003788
      vs PGS003798 r=-0.965). The paper defines weighted LDpred2 as a linear combination of EUR and target PRS;
      the combination looks mis-deposited. Recommend quarantine.'
    corrections:
    - kind: broken_weights
      action: quarantine
      effect: 'Proposed quarantine: the deposited weights are degenerate, so any percentile from this file is meaningless.
