summary: '171 red-cell scores from 13 papers. 160 are in scope and all point the same way: a higher score
  means a higher measured value. New concepts: blood.red_cell_count (red cell count, hematocrit), blood.red_cell_indices
  (MCV, MSCV, mean reticulocyte volume, MCH, MCHC) and blood.red_cell_distribution_width (RDW); immature
  reticulocyte fraction joins blood.reticulocyte_count, and the 58 hemoglobin and reticulocyte scores
  curated earlier are reused. Seeds come from three papers already read (Xu 2022 elastic net, Vuckovic
  2020 aligned GWAS betas, Tanigawa 2022 snpnet template); the other 79 are catalog-only, corroborated
  by 1000G EUR r >= +0.2 with a seed of the same phenotype. One BBJ-trained MCH score (PGS002371, max
  r +0.18) is in review. The 11 PGP000723 variance (vQTL) scores are out of scope. No lookups were needed
  and no same-concept pair is anti-correlated after alignment.'
