    cluster: substance_use.alcohol_consumption
    phenotype: alcohol_quantity
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: alcoholic drinks per week
      coding: null
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Alcohol consumption (drinks per week)
      confidence: medium
    lead_variant_check:
      status: not_run
      note: GCKR rs1260326 C (more drinking in every other DPW score) carries a positive weight
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PRS-CS on GSCAN drinks per week; PGS Catalog weights are per-allele
      effects on the reported trait. Corroborated by OR 1.19 (CI 1.14-1.25) against 'Alcohol consumption (drinks
      per week)' in FinnGen, and 1000G EUR r = +0.95 with GSCAN 2019 DPW scores PGS000203/PGS000204.
  PGS002757:
