summary: 'Thirteen scores in the insomnia group. Eight are genuine insomnia scores mapped to the new concept sleep.insomnia
  (higher = more insomnia): the two Prive scores on the raw UKB 1200 code (1 never/rarely ... 3 usually, read from the
  authors'' code), Campos PGS000908 on the Jansen 2019 GWAS, and the five ExPRSweb *_1200_* scores (catalog-only, OR
  > 1 vs MGI insomnia). The five ExPRSweb *_1160_* scores are labelled Insomnia in the catalog but were trained on the
  UKB 1160 sleep-duration GWAS; they correlate positively with the sleep-duration scores, so they go to sleep.sleep_duration
  (higher = longer sleep). That label mix-up explains all 9 negative pairs; no in-group sign flip. PGS003473 (other group)
  looks sign-flipped and needs review there.'
