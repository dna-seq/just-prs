summary: Folded about 30 small psychiatric and wellbeing groups. Depression variants got their own phenotypes under
  psychiatric.depression (recurrent MDD, help-seeking, probable, self-reported, ever depressed for a week, recent
  low mood, anhedonia, appetite, trauma-related); neuroticism (score and EPQ yes/no items), anxiety, schizophrenia,
  bipolar (any/I/II), autism and self-harm thoughts are new psychiatric concepts; loneliness, friendships and social
  activities went to wellbeing.social_connection and tiredness to wellbeing.fatigue. Privé items were read from
  the authors' coding script (all yes/symptom = case); most others are catalog-only with 1000G correlation support.
  Tanigawa tiredness/anhedonia frequency are annotated but flagged for review (GBE value order undocumented); friendship
  satisfaction is left unannotated.
