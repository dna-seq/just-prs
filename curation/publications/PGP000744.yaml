    lead_variant_check:
      status: agree
      note: CRP-locus weight (1:159749612 T, -0.83) has the same sign as the UK Biobank CRP scores PGS002864/PGS002865/PGS002870
        at that position; 1000G EUR r=+0.30 (mean) with the main CRP scores.
    review_reason: null
    status: agent_proposed
    notes: iPRS = 1,113 clumped SNPs weighted by per-allele betas from a UK Biobank GWAS of the INFLA-score itself
      (372,299 Europeans, both sexes), so higher score = higher INFLA-score. The main text defines INFLA-score as
      a composite measure of low-grade systemic inflammation; the decile-sum coding (higher = more inflammation)
      is in reference 23, not quoted here. Catalog beta 0.4274 [0.4072, 0.4472] against INFLA-score agrees. Applied
      in the paper to women with breast cancer (higher iPRS = worse fatigue before chemotherapy).
