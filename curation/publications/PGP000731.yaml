      paper_direction: increases
      evidence: 'Paper abstract: all PRSs positively associated with alcohol reinforcing value and drinking motives.
        File: 5/5 lead loci with GWAS Catalog data carry the non-risk allele as the positive-weight allele (rs1813006,
