summary: 'All 11 scores measure UK Biobank male hair/balding pattern (field 2395), from
  three papers. Privé (PGP000263: PGS001987, PGS002204) uses the raw pattern number 1-4
  in men as a quantitative trait, so a higher score means a higher pattern number (more
  balding); both carry a review_reason because no source describes the patterns in words.
  The 8 Weissbrod ''Balding Type 1'' scores (PGP000332) and Ding PGS003558 (PGP000457)
  stay unannotated: no reachable source states how field 2395 was coded. The Weissbrod
  scores anti-correlate with the Privé/Ding scores in 1000G EUR (r down to -0.85) and
  weight the opposite allele at chr2:173746578, consistent with Type 1 meaning no balding,
  but that is inference, not a quote.'
