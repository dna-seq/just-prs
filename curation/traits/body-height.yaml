summary: 'All height scores go into one concept, anthropometry.height (axis: taller, neutral), with three
  phenotypes: adult standing height, sitting height, and self-reported height at age 10. For 98 of the
  108 in-scope scores, a higher score means taller; 94 of them are catalog-only, backed by beta CIs (PGP000517/679/755)
  or 1000G r >= +0.2 with such anchors. Ten ExPRSweb scores (PGP000393) built on "GIANT-Yang2012-height"
  (GCST001676, the Yang 2012 variance GWAS) are left unannotated: eight of them correlate at r -0.3 to
  -0.58 with every other height score, yet the catalog reports positive betas. PGS000998 (UKB 1697, codes
  not in height order) and PGS003889 (PRS-CSx ARB component, about zero correlation) have their direction
  inferred and are flagged for review. Three adipose-volume scores that are only adjusted for height are
  out of scope.'
