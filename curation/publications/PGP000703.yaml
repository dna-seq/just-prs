scores:
  PGS005121:
    cluster: respiratory.asthma
    phenotype: asthma
    measurement_kind: binary
    score_effect:
      direction: increases
      target: risk of asthma (GBMI PheCode and/or self-report case definition)
      coding: null
    polarity: 1
    evaluation_outcome: null
    strata: {}
    provenance:
    - source: full_text
      locator: Results > GBMI discovery meta-analysis
      quote: Despite the standardized phenotype definitions used by each biobank, which included the asthma PheCode
        and/or self-reported data
      confidence: high
    - source: catalog
      locator: scores.trait_reported | trait_efo
      quote: Asthma | asthma
      confidence: medium
    lead_variant_check:
      status: not_run
      note: null
    status: agent_proposed
    notes: PRS-CSx posterior weights, catalog name forAFR_fromAFR (target population x GWAS discovery population).
      The paper reports only liability-scale R2 and never states direction in words; direction follows the PGS Catalog
      convention (per-allele effects on asthma). Looked up because the from-EAS scores correlate about -0.9 in 1000G
      EUR with PGP000704 (PGS005141/PGS005148); every PGP000703 score correlates positively (r +0.2 to +0.7) with
      independently annotated asthma scores (e.g. PGS002754, PGS002727), so PGP000704 is the inverted side.
