summary: All 35 scores are in scope under one new concept, endocrine.gout (higher risk of gout, undesirable). 32 are gout
  risk scores and 3 are serum/plasma urate scores (phenotype serum_urate, sign +1). Every pairwise 1000G EUR correlation is
  positive (min +0.05), so there is no direction split. The 32 gout scores are catalog-only annotations corroborated by OR/HR
  or correlation with an OR/HR-backed score; the urate scores were read (two full texts state urate-raising alleles; PGS002290
  abstract only plus correlation). For every score a higher percentile means more urate and higher gout risk.
