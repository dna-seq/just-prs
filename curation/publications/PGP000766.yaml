        rs111464338 not in GWAS Catalog'
    review_reason: 'Possible partial allele misorientation: 2 of 4 checked top variants disagree with GWAS Catalog
      SBP alleles and the score barely correlates with other SBP scores in 1000G EUR (max r 0.13).'
    status: agent_proposed
    notes: 240 Evangelou 2018 SBP variants (Methods table); weights standardized to SD. Evaluated on dCCB discontinuation
      in UK Biobank CCB users, not on SBP itself.
  PGS005317:
