      cardiovascular_disease:
        label: Cardiovascular disease (composite of heart attack, coronary disease, angina and stroke)
        axis: higher risk of cardiovascular disease
        valence: undesirable
        valence_basis: Composite cardiovascular disease (coronary events plus stroke/TIA) is the leading
          cause of death; a separate concept from coronary artery disease and stroke because these scores
          were trained on the pooled endpoint, which a person reads as "heart attack or stroke".
