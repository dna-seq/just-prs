summary: '67 of 68 matched scores are in scope; all are annotated and every one points the same way: a higher score means
  higher risk. Most are Alzheimer''s disease scores (neurology.alzheimers_disease, incl. one family-history score); all-cause,
  vascular and unspecified dementia scores go to a separate neurology.dementia concept. No negative 1000G pairs; 65 were
  annotated without a new lookup (58 catalog-only from OR/HR or r>=0.2 with a corroborated AD score, 7 UKB snpnet scores
  from the already-read PGP000244 template), PGS000876 and PGS004318 were read. About half the files contain no APOE-region
  variant (recorded as strata apoe_region: excluded), which explains their low correlation with APOE-dominated scores.
  PGS004318 is in review: its rs7412 (APOE e2) weight points the wrong way. PGS000777 (Parkinson''s disease dementia)
  is out of scope.'
