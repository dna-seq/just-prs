      GALNT2, ABCA1 and HNF4A, and the file correlates about -0.81 with the HDL consensus in 1000G EUR. Likely the
      listed betas refer to the other allele than ''altAllele''. As scored from the PGS Catalog file a higher value
      means LOWER genetic HDL-C. Sibling LDL/TG/TC scores from this paper are not inverted. Candidate for a catalog
      erratum.'
