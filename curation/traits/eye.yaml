summary: '74 eye scores in 14 concepts of a new eye domain; 72 annotated, 2 axis-angle scores left without direction
  (circular measure). Disease scores (glaucoma, cataract, AMD, retinal detachment, corneal, uveitis, diabetic eye) are
  higher = more risk, backed by ORs, 1000G correlations and canonical loci (TMCO1, MYOC, ARMS2, CFH, TCF4, HLA-B27).
  Refractive axis points to myopia: myopia-diagnosis scores are +, while spherical power, Clark''s refractive-error PGS
  (paper: high = hyperopia) and age-started-glasses are higher = less myopic (polarity -1); 1000G r about -0.58 between
  the two groups confirms it. Keratometry meridians are in dioptres (higher = steeper cornea). Review: PGS001358 cylinder
  notation inferred from range; PGS002045 eye inflammation has no corroboration; Tanigawa time-to-event scores rest on
  the paper-wide rule.'
