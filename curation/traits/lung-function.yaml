summary: 'Lung function (FEV1, FVC, FEV1/FVC, PEF) and COPD are split into two concepts: respiratory.lung_function
  (higher = better) and respiratory.copd (higher = more risk). Three scores reported as lung function are COPD-risk
  oriented (higher = lower lung function): PGS000210 (Shrine 2019, FEV1/FVC-decreasing alleles), PGS001800 and PGS001801
  (Moll 2020 PRS components); they carry polarity -1. PGS003465 (HCHS/SOL FEV1/FVC) also looks flipped (lead variants,
  r=-0.76) but the paper does not say so; left unannotated pending its supplement. PGS003862-65 (Shrine 2023) point
  to higher FEV1/FVC by weights and correlation, but the catalog also lists a COPD OR 1.63 per SD increase, so their
  catalog COPD metrics look sign-inconsistent. PGS004438 (FEV1 % predicted) not read; PGS004437 (predicted FEV1
  reference value) out of scope. No aligned-correlation conflicts remain.'
