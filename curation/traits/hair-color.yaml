summary: 'Hair color splits into two concepts: pigmentation.hair_color (axis darker hair) and pigmentation.red_hair,
  because red is MC1R pheomelanin and does not sit on the dark-light scale. The Tanigawa (GBE) one-hot categories
  and Privé''s darker_hair0 / red_hair scores are annotated from phenotype code and catalog definitions; after alignment,
  no pair within a concept correlates negatively. The eight Weissbrod ''Hair color'' (pigment_HAIR) scores stay
  unannotated: no source we reached gives the value order. In 1000G they run toward lighter hair, so a raw 1747
  coding would mean their weights are inverted. The ''Other'' category is unannotated because it has no defined
  colour.'
