summary: 'All 36 scores are in scope under immune.c_reactive_protein; 35 measure circulating CRP and one (PGS005251)
  the INFLA-score composite. 34 are annotated as higher score = higher CRP / more inflammation: 6 catalog-only biobank
  scores, 27 ExPRSweb scores from the paper''s construction rule, and the iPRS from its full text. Two ExPRSweb
  files (PGS002882, PGS002887) carry degenerate near-zero weights and are left unannotated with a proposed quarantine.
  The ExPRSweb scores built from the small UKHLS CRP GWAS (PGS002860-2863, PGS002879-2883) are uncorrelated with
  the rest and three have negative MGI betas, so they sit in review; the INTERVAL CRP-protein DBSLMM/PRS-CS scores
  (PGS002877/2878/2888) are also nearly uncorrelated with the main CRP scores. No sign flips.'
