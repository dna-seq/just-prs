summary: 'All 11 scores measure resting heart rate / pulse rate (UKB fields 102, 4194, 95, 22426, a youth GRS and
  an HCHS/SOL score); no heart-rate-variability or exercise-response scores were found. New concept cardiovascular.heart_rate
  with one phenotype, resting_heart_rate (+). Ten scores mean higher score = faster resting pulse (4 read via the
  Tanigawa snpnet template, 1 via Ding et al. methods, 5 catalog-only corroborated by 1000G r=+0.33..+0.77). PGS003472
  (Zhang 2022, HCHS/SOL) anti-correlates with all ten (r=-0.24..-0.40) and its top weights at CCDC141 rs17362588,
  GJA1 and MYH6 are opposite to the source GWAS: recorded as distributed (higher = slower pulse) with a deposit_inverted
  correction and sent to review.'
