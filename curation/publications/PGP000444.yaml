      thickness (no CI, effectively null) is not read as contradicting.
  PGS003441:
    cluster: neurology.alzheimers_disease
    phenotype: alzheimers_disease
    measurement_kind: binary
    score_effect:
      direction: increases
      target: risk of Alzheimer's disease
      coding: null
    polarity: 1
    evaluation_outcome:
      expected_metric_sign: -1
      basis: evaluated on a cognition/memory measure, which Alzheimer's risk lowers
    strata:
      apoe_region: included
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: Alzheimer's disease
      confidence: medium
    lead_variant_check:
      status: not_run
      note: null
    review_reason: null
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; 1000G EUR r=+0.70 with PGS004116 (OR 1.2393 [1.21795, 1.26102] vs 'AD'). APOE region variants present
      in the file.
  PGS003442:
    cluster: psychiatric.depression
    phenotype: major_depressive_disorder
    measurement_kind: binary
    score_effect:
      direction: increases
      target: genetic risk of major depressive disorder (8 genome-wide significant Howard 2019 loci)
      coding: null
    polarity: 1
    evaluation_outcome:
      expected_metric_sign: 1
      basis: Evaluated on fluid cognition / inhibitory-control BOLD activation in ABCD children, not MDD.
    strata: {}
    provenance:
    - source: full_text
      locator: Methods > Genetic risk scores (GRS)
      quote: MDD and AD (full, APOE [chromosome 19:44.4–46.5 Mb] and no-APOE) GRSs were each computed as the weighted
        sum of risk alleles
      confidence: high
    - source: abstract
      locator: Abstract
      quote: higher MDD GRS were linked to delayed functional neurodevelopment
      confidence: medium
    lead_variant_check:
      status: agree
      note: 3 of top 4 checked agree with Howard 2019 (GCST007342) risk alleles (rs200949-A, rs72710803 non-risk
        A negative, rs2568958-A); rs12127789 not found in catalog.
    review_reason: null
    status: agent_proposed
    notes: Weights ~ ln(OR) of Howard 2019 risk alleles; 8-SNP score, so near-zero 1000G correlation with genome-wide
      MDD scores is expected.
