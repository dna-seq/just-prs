summary: '68 asthma scores from 19 papers; 66 annotated, 2 left unread (lookup budget).

  Almost all are plain asthma-risk scores: higher = more likely to have or develop asthma; 42 annotated
  catalog-only, corroborated by CI-backed OR/HR or 1000G correlation.

  PGP000704 (PGS005141, PGS005148) looks inverted at deposit: the paper reports OR 1.27 per SD, but the
  file''s lead risk alleles carry negative weights and it correlates -0.9 with PGP000703 EAS scores; recorded
  as ''decreases'' and sent to review.

  PGS001370 is age at asthma diagnosis (own concept), PGS000810 combined allergic disease.

  Open: PGS002248 (childhood asthma) and PGS002358 (BBJ) have ~0 correlation with the rest and were not
  read.'
