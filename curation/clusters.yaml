      reticulocyte_count:
        label: Reticulocyte count
        axis: higher reticulocyte count
        valence: neutral
        valence_basis: Reticulocytes are young red blood cells; in healthy people the count varies within
          a normal range and neither end is better. Very high values signal blood loss or hemolysis and
          very low values poor red-cell production, but the polygenic range reflects normal variation.
          Absolute counts, the percentage of red cells and the high-light-scatter (more immature) subset
          share the same axis.
        status: agent_proposed
        aliases:
        - reticulocytes
        - young red blood cells
        - immature red blood cells
        - retic count
        - red cell production
        phenotypes:
          reticulocyte_count:
            label: Absolute reticulocyte count
            sign: 1
          reticulocyte_percentage:
            label: Reticulocytes as a percentage (fraction) of red cells
            sign: 1
          hlsr_count:
            label: High light scatter reticulocyte count
            sign: 1
            aliases:
            - HLSR count
            - high light scatter reticulocytes
          hlsr_percentage:
            label: High light scatter reticulocytes as a percentage of red cells
            sign: 1
            aliases:
            - HLSR percentage
