summary: 'All 45 scores sit in one concept, musculoskeletal.bone_density (axis: denser, stronger bones; desirable). Density
  measures (DXA BMD, heel eBMD/T-score, heel SOS, heel BUA) have sign +1 and osteoporosis (incl. ICD-10 M81 and time-to-event)
  has sign -1. 45/45 annotated: PGS000121/PGS000122 are risk-allele GRS where a higher score means LOWER BMD (polarity
  -1, by design); every other density score increases its measure and every osteoporosis score increases risk. Two East
  Asian osteoporosis scores (PGS005146, PGS005155) have a paper-stated OR>1 but correlate weakly negatively with European
  osteoporosis scores in 1000G EUR, so they are held for review. gSOS (PGS000657) is read from the paper but shows ~0
  correlation with every peer in 1000G, likely due to rare large-weight variants.'
