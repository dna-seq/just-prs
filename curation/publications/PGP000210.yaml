      recorded: '2026-09-27'
      by: agent
      upstream_report: null
    - kind: metric_not_from_file
      action: discount_metrics
      effect: The paper's performance metrics describe the authors' own score, not this inverted file, so they must
        not raise its quality tier.
      paper_direction: null
      evidence: The paper's quartile results (Q4 = higher HDL-C) describe the non-inverted score; the deposited
