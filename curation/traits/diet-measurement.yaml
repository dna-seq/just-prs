summary: 26 food and supplement intake scores, mostly UK Biobank questionnaire scores from Tanigawa 2022 (PGP000244),
  sorted into 15 lifestyle diet concepts by food type; every score is annotated and none correlate the wrong way within
  a concept. Higher score = eats or drinks that item more often, or more likely gives that answer (never eats sugar/wheat,
  uses skimmed milk, takes glucosamine or folic acid, changed diet because of illness). PGS001059 (cornflake-type cereal)
  sits on the low end of the cereal_type axis. The six GBE QT_FC frequency scores (oily fish, beef, poultry, processed
  meat, cheese, salt) assume the raw UKB order is kept and carry a review_reason because GBE's recoding is undocumented.
  Water scores from GBE and Privé agree (r=+0.51..0.89); PGS004221 (Merino 2023) is relative carbohydrate intake. Alcohol
  and coffee scores are out of scope (own runs).
