pgp_id: PGP000313
scores:
  PGS002285:
    cluster: lipids.ldl_cholesterol
    phenotype: ldl_cholesterol
    measurement_kind: continuous
    score_effect:
      direction: increases
      target: LDL cholesterol level
    polarity: 1
    provenance:
    - source: catalog
      locator: scores.trait_reported
      quote: LDL cholesterol
      confidence: medium
    lead_variant_check:
      status: agree
      note: 'reference LDL lead SNPs (APOE, PCSK9, LDLR, APOB, SORT1, ABCG5/8): 2 agree, 0 disagree'
    status: agent_proposed
    notes: Catalog-only annotation (paper not read). PGS Catalog weights are per-allele effects on the reported
      trait; corroborated by 1000G EUR correlation r=+0.58 with already-annotated PGS000887.
  PGS002287:
    cluster: lipids.triglycerides
    phenotype: triglycerides
    measurement_kind: continuous
    score_effect:
