  PGS003472:
    cluster: cardiovascular.heart_rate
    phenotype: resting_heart_rate
    measurement_kind: continuous
    score_effect:
      direction: decreases
      target: resting heart rate (beats per minute), as the file is distributed
      coding: null
    polarity: -1
    evaluation_outcome:
      expected_metric_sign: 1
      basis: Catalog betas are for the respiratory event index and OSA (sleep apnoea), another concept; they describe
        the authors' score, not this file.
    strata: {}
    provenance:
    - source: full_text
      locator: Results > PRS association with their intended phenotypes
      quote: All PRSs of correlated traits were associated with their corresponding phenotypes (Supplementary Figure
        3).
      confidence: low
    - source: catalog
      locator: scores.trait_reported
      quote: Heart rate
      confidence: low
    lead_variant_check:
      status: disagree
      note: rs17362588 A (2:178856319) weight -0.245, but the source GWAS GCST001969 says A = 0.736 unit increase
        in heart rate; GJA1 positions 6:121406612 A, 6:121435182 C, 6:121789200 G and MYH6 14:23397504 G all carry
        negative weights where the UKB pulse-rate scores carry positive ones
    review_reason: Suspected inverted deposit; direction recorded as distributed (higher score = lower heart rate),
      inferred from lead loci and 1000G anti-correlation, not from a stated sign.
    corrections:
    - kind: deposit_inverted
      action: polarity_as_distributed
      effect: Direction describes the file as distributed (higher = lower heart rate); the paper's PRS is a heart-rate
        PRS validated against its own phenotype.
      paper_direction: increases
      evidence: 5/5 canonical heart-rate lead loci opposite to the source GWAS / consensus (CCDC141 rs17362588,
        three GJA1 positions, MYH6); 1000G EUR r = -0.24 to -0.40 with all 10 other heart-rate scores, which correlate
        +0.33 to +0.77 with each other. Same paper's FEV1/FVC score PGS003465 shows the same pattern.
      recorded: 2026-10-19
      by: agent
      upstream_report: null
    - kind: metric_not_from_file
      action: discount_metrics
      effect: Catalog REI/OSA betas (0.019, 0.032) describe the authors' oriented score, not the deposited file.
      evidence: Lead-variant signs opposite to the source GWAS.
      recorded: 2026-10-19
      by: agent
      upstream_report: null
    status: agent_proposed
    notes: LDpred2-auto on den Hoed 2013 heart-rate GWAS (GCST001969) in HCHS/SOL; paper gives no explicit sign
      in text (Supplementary Figure 3 is image-only). Suspected sign flip vs every other heart-rate score.
  PGS003480:
    score_effect: null
    unannotated_reason: 'Suspected sign-flipped deposit, not recorded: the paper (Dashti 2019 hours GWAS, LDpred2-auto,
      Supplementary Note 2) never states the orientation, and its only reported associations (REI/OSA, Supplementary
      Tables 4-5) are null. The file looks like SHORTER sleep: rs1823125-G (longer-sleep allele, Gottlieb 2015)
      has weight -0.0014, and 1000G EUR r = -0.87 with PGS002196, -0.76 with PGS001978, -0.53 with PGS001150, -0.39
      with PGS003764. Only one canonical locus could be checked (rs13107325 and rs12209200 not usable), so the deposit_inverted
      bar (>=2 opposite canonical loci) is not met.'
    status: agent_proposed
    notes: Same paper's PGS003465 (FEV1/FVC) shows the same pattern of weights pointing opposite to the catalog
      convention.
