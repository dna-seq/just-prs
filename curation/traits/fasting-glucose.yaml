summary: |
  All 26 "blood glucose amount" scores are fasting-glucose scores in endocrine.glycemia; a higher score means higher fasting glucose.
  14 are annotated: PGS000305/PGS000306 (TRAILS GRS, read), PGS001350 (MAGIC PRS-CS, read), and 11 catalog-only scores anchored to them by 1000G correlation (Aly subtype GRS, Korean FPG GRS, and the MAGIC-based ExPRSweb scores).
  12 ExPRSweb scores are left unannotated: the ten built on the "FGovertime-corrected" GWAS and the MAGIC DBSLMM MGI score carry no signal (|r| < 0.15 with every other score), and PGS002952 is a duplicate of PGS002947 despite its MAGIC name.
  No negative same-concept correlations and no inverted deposits were found.
