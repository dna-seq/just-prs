summary: '125 in-scope LDL-family scores (119 LDL-C, 4 apoB, 1 non-HDL-C, plus GS9) sit in one concept, lipids.ldl_cholesterol;
  higher = higher atherogenic lipids for all but one. 121 are annotated, mostly catalog-only, corroborated by a
  CI-excluding beta/OR on LDL or 1000G r >= +0.2 with an annotated score, plus a lead-SNP allele check. The catalog''s
  strongest negative pair (PGS003788 vs PGS003798, r=-0.965) is a broken deposit, not an inversion: the three PGP000489
  weighted-LDpred2 files carry a near-constant weight on every variant, so they are left unannotated and should
  be quarantined. PGS000061 (PGP000045) is a real inversion of the deposited file: the weights follow the paper''s
  A2_weight column, which is opposite to known LDL effects at all 6 reference loci, so a higher score means lower
  LDL (polarity -1); a human should confirm. PGS000192 (GS9) stays unannotated: it is an LDL+HDL composite, and
  its allele orientation cannot be checked without the paywalled Table 1. LOX-1 and statin response are out of scope.'
