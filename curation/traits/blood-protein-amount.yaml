summary: '82 scores: 79 LDpred scores for single Olink CVD-I proteins (Folkersen 2020, SCALLOP) and 3 UK Biobank
  serology antibody levels (Tanigawa 2022 snpnet). Each protein or virus is its own concept with one + phenotype;
  higher score = higher circulating level. Directions come from the papers'' construction (LDpred on protein GWAS;
  Gaussian snpnet on the median MFI), with the ST2 Mendelian-randomization passage stating it explicitly. Negative
  1000G correlations are all between different proteins, so no sign flips. Allele-level lead-variant checks were
  not run; top variants sit at the expected cis loci where looked at.'
